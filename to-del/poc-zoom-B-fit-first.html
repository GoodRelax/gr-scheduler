/* ==========================================================================
   poc-ui.css -- the single source of every colour used by the PoC pages.
   Every PoC page links this file and defines NO colour of its own.

   Authority for the values:
     handover/07-plan-actual/handover-plan-actual-decisions-ja.md  2-6
     handover/03-ui-naming/handover-ui-detail-spec-ja.md           6-1-2

   Rules carried over from those documents:
     - plan and actual share ONE hue; plan is medium saturation and light,
       actual is high saturation and dark. No pure primaries.
     - dependency lines are orange in both themes and are never user-settable.
     - text is the theme foreground: black on light, white on dark.
     - contrast of actual over plan must stay at or above 3:1 (WCAG 1.4.11).

   The dark values live in ONE block that both the OS preference and the
   explicit toggle point at. Keeping two copies is what let them drift apart.
   ========================================================================== */

:root {
  color-scheme: light dark;

  /* ---- page chrome */
  --bg: #ffffff;
  --ink: #16181d;
  --sub: #5b6068;
  --rule: #d9dce1;
  --panel: #f5f6f8;
  --accent: #2b5ea8;
  --good: #1f7a3d;
  --warn: #a8600f;
  --bad: #a02b2b;

  /* ---- schedule: one hue drives plan and actual together */
  --hue: 214;
  --plan-fill: hsl(var(--hue) 46% 80%);
  --plan-stroke: hsl(var(--hue) 44% 46%);
  --actual-fill: hsl(var(--hue) 62% 34%);
  --actual-stroke: hsl(var(--hue) 66% 22%);

  /* ---- fixed-role colours */
  --dep: hsl(26 88% 44%);
  --lightning: hsl(354 62% 42%);
  --marker-ink: #16181d;
  --marker-bg: #ffffff;
  --status: #8b9099;

  /* ---- row banding */
  --band: hsl(var(--hue) 42% 96%);
  --band-edge: hsl(var(--hue) 34% 88%);
  --row-top: hsl(var(--hue) 40% 97%);
  --row-alt: #fafbfc;

  /* ---- label ink. Black on light, white on dark. */
  --label-ink: #000000;
  --label-halo: var(--bg);

  /* ---- drop shadow for floating layers. Darker on dark, where a light-theme
     shadow disappears into the background instead of lifting the layer off it. */
  --shadow: rgba(0, 0, 0, 0.28);
}

/* One dark definition, two ways to reach it. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161a;
    --ink: #e8eaee;
    --sub: #9aa1ab;
    --rule: #333840;
    --panel: #1c1f25;
    --accent: #7aa6e0;
    --good: #6fc98d;
    --warn: #e0a353;
    --bad: #e07a7a;
    --plan-fill: hsl(var(--hue) 32% 26%);
    --plan-stroke: hsl(var(--hue) 46% 66%);
    --actual-fill: hsl(var(--hue) 62% 64%);
    --actual-stroke: hsl(var(--hue) 70% 80%);
    --dep: hsl(30 92% 60%);
    --lightning: hsl(354 70% 64%);
    --marker-ink: #e8eaee;
    --marker-bg: #14161a;
    --status: #767c86;
    --band: hsl(var(--hue) 18% 20%);
    --band-edge: hsl(var(--hue) 16% 28%);
    --row-top: hsl(var(--hue) 20% 17%);
    --row-alt: #191c21;
    --label-ink: #ffffff;
    --shadow: rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {

/* ==========================================================================
   Shared page furniture.

   Two page kinds, matching 08-poc/README.md:
     body.reading     prose pages -- body 16px / line-height 1.7
     body.instrument  dense control surfaces -- 13px, never below the 12px
                      Japanese-readability floor
   ========================================================================== */

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}

body.reading { font-size: 16px; line-height: 1.7; padding: 0 0 80px 0; }
body.instrument { font-size: 13px; line-height: 1.55; padding: 0 0 40px 0; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px; }

header {
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  padding: 16px 0 0 0;
}
header .wrap { padding-bottom: 4px; }
h1 { margin: 0 0 6px 0; font-size: 24px; line-height: 1.35; }
h2 { font-size: 20px; margin: 32px 0 8px 0; padding-top: 12px; border-top: 1px solid var(--rule); }
h3 { font-size: 17px; margin: 20px 0 5px 0; }

.lede { margin: 0 0 12px 0; color: var(--sub); font-size: 16px; }
.hint { margin: 0 0 12px 0; color: var(--sub); font-size: 14px; }
.note {
  background: var(--panel);
  border-left: 3px solid var(--plan-stroke);
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 14px;
}
.rule {
  background: var(--panel);
  border-left: 3px solid var(--plan-stroke);
  padding: 9px 13px;
  margin: 0 0 14px 0;
  font-size: 14px;
  white-space: pre-wrap;
  font-family: Consolas, "Courier New", monospace;
}

table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; }
th, td { border: 1px solid var(--rule); padding: 5px 9px; text-align: left; }
th { background: var(--panel); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

button {
  font: inherit;
  font-size: 14px;
  padding: 3px 12px;
  cursor: pointer;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: 4px;
}

.pill { display: inline-block; padding: 3px 13px; border-radius: 13px; font-weight: 700; font-size: 14px; }
.flag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; }
.p-good, .f-good { background: color-mix(in srgb, var(--good) 16%, var(--bg)); color: var(--good); }
.p-bad, .f-bad { background: color-mix(in srgb, var(--bad) 16%, var(--bg)); color: var(--bad); }
.p-warn, .f-warn { background: color-mix(in srgb, var(--warn) 16%, var(--bg)); color: var(--warn); }

.val { font-variant-numeric: tabular-nums; min-width: 64px; color: var(--accent); font-weight: 700; }

svg { display: block; }

/* ==========================================================================
   Scrollbars -- always visible, half the environment default width.
     handover/03-ui-naming/handover-ui-detail-spec-ja.md  5-2

   Always visible because a scrollbar that appears and disappears changes the
   canvas width, and a changed width re-runs the layout and moves the stacks.
   Half width because something shown at all times must not eat the drawing
   area at full size. Windows draws 17px by default, so 8px is the half.
   ========================================================================== */
/* `scrollbar-width` is NOT set here on purpose. When both it and the
   ::-webkit-scrollbar pseudo are present, the standard property wins and the
   pseudo is ignored -- `thin` measured 10px where the rule asks for 8. */
.alwaysScroll { overflow: scroll; }
.alwaysScroll::-webkit-scrollbar { width: 8px; height: 8px; }
.alwaysScroll::-webkit-scrollbar-track { background: var(--panel); }
.alwaysScroll::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
.alwaysScroll::-webkit-scrollbar-thumb:hover { background: var(--sub); }
.alwaysScroll::-webkit-scrollbar-corner { background: var(--panel); }

/* Pointer shapes for panning. "Pointer" is the mouse; `Cursors` is the set of
   date lines on the canvas -- see handover-ui-parts-ja.md 2-1-5. */
.panReady { cursor: grab; }
.panning, .panning * { cursor: grabbing !important; }

/* ---- flat store, built from the defaults ------------------------------- */
var S = {};
SPEC.forEach(function (sp) { S[sp.k] = sp.d; });

  SPEC.forEach(function (sp) { out[sp.k] = sp.rng(S); });

/* ---- derived geometry --------------------------------------------------- */

function hasThickness(kind) { return kind === "rectangle" || kind === "chevron"; }

 * Dependency-line runs. ONE ratio drives both so they cannot drift apart.
 * The entry needs the arrowhead plus a visible straight piece; the exit has

 *   handover-ui-detail-spec-ja.md 4-9

  return Math.min(planWidth * S.chevronNotchOfW, planHeight * S.chevronNotchOfH);

/**

 * height ratio, and deliberately NOT clamped a second time, so the two slopes
 * hold the same angle at every zoom (07 2-2-1).
 *
 * Clamping both independently is what let the angles diverge: the width clamp
 * bites at a different zoom for the plan than for the actual, because the two
 * differ in width AND in height. Measured divergence was 26.6 vs 22.3 degrees.

function shapeMetrics(kind, zoomY) {
  var ratio = shapeRatio(kind);
  // One clamp, on the plan height. The actual then follows by ratio alone and
  // is guaranteed to clear its own 16px floor, so it needs no second clamp --
  // two independent clamps are what let the ratio drift away from the spec.
  var planHeight = Math.max(planFloor(), S.basePlanH * zoomY) * ratio;
  var actualHeight = planHeight * S.actualOfPlan;
  var thin = !hasThickness(kind) && kind !== "milestone";
  var rawFont = actualHeight * S.fontOfActual * (thin ? S.thinFontScale : 1);
  var fontSize = Math.max(S.fontMin, rawFont);
  var markText = Math.max(S.fontMin, fontSize * S.markerTextOfFont);
  return {
    kind: kind,
    planHeight: planHeight,
    actualHeight: actualHeight,
    fontSize: fontSize,
    fontFloored: rawFont < S.fontMin,
    markerTextSize: markText,
    markerSize: Math.max(S.markerMin, markText * S.markerOfText),
    reserved: hasThickness(kind) ? planHeight : planHeight + S.actualGap + actualHeight,
    insideActualTop: (planHeight - actualHeight) / 2,
    belowActualTop: planHeight + S.actualGap,
    thinStroke: Math.max(S.thinStrokeMin, Math.min(S.thinStrokeMax, planHeight * S.thinStrokeOfPlan)),
    glyphSize: planHeight

/* ---- text metrics. Estimated, never measured, never cached. ------------- */

function isFullWidth(ch) {
  var c = ch.charCodeAt(0);
  return (c >= 0x1100 && c <= 0x115F) || (c >= 0x2E80 && c <= 0xA4CF) ||
         (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0xF900 && c <= 0xFAFF) ||
         (c >= 0xFE30 && c <= 0xFE6F) || (c >= 0xFF00 && c <= 0xFF60) ||
         (c >= 0xFFE0 && c <= 0xFFE6);
}

/** Width in half-width units: full-width counts 2, half-width counts 1. */
function widthUnits(s) {
  var n = 0, i;
  for (i = 0; i < s.length; i++) n += isFullWidth(s.charAt(i)) ? 2 : 1;
  return n;

function labelWidth(s, fontSize) { return widthUnits(s) * fontSize * S.labelCoef; }

/**
 * SVG attributes that put a background-coloured edge around a label, so the
 * text is legible over any bar colour without changing the text colour

 */
function haloAttrs(fontSize) {
  if (!S.labelHaloOfFont) return "";
  return ' stroke="var(--label-halo)" stroke-width="' +
    (Math.round(fontSize * S.labelHaloOfFont * 100) / 100) +
    '" paint-order="stroke fill" stroke-linejoin="round"';

/** Cut to truncateUnits half-width units, appending a half-width ellipsis. */
function truncateUnits(s, units) {
  if (widthUnits(s) <= units) return s;
  var out = "", n = 0, i, w;
  for (i = 0; i < s.length; i++) {
    w = isFullWidth(s.charAt(i)) ? 2 : 1;
    if (n + w > units - 3) break;
    out += s.charAt(i);
    n += w;
  }
  return out + "...";

/* ---- colour maths -------------------------------------------------------
 * Everything here answers one question: with the label ink fixed to black on
 * light and white on dark, which plan/actual colours can still be used?
 *   WCAG 1.4.3  text over its background          >= 4.5:1
 *   WCAG 1.4.11 actual over plan (non-text)       >= 3:1
 * ------------------------------------------------------------------------- */

/** HSL (h in degrees, s and l in 0..1) to sRGB 0..1. */
function hslToRgb(h, s, l) {
  var c = (1 - Math.abs(2 * l - 1)) * s;
  var hp = ((h % 360) + 360) % 360 / 60;
  var x = c * (1 - Math.abs((hp % 2) - 1));
  var r = 0, g = 0, b = 0;
  if (hp < 1) { r = c; g = x; }
  else if (hp < 2) { r = x; g = c; }
  else if (hp < 3) { g = c; b = x; }
  else if (hp < 4) { g = x; b = c; }
  else if (hp < 5) { r = x; b = c; }
  else { r = c; b = x; }
  var m = l - c / 2;
  return [r + m, g + m, b + m];

/** WCAG relative luminance of an sRGB 0..1 triple. */
function luminance(rgb) {

    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);

function lumOfHsl(h, s, l) { return luminance(hslToRgb(h, s, l)); }

/** WCAG contrast ratio between two relative luminances. */
function contrast(y1, y2) {
  var hi = Math.max(y1, y2), lo = Math.min(y1, y2);
  return (hi + 0.05) / (lo + 0.05);
}

var BLACK_Y = 0, WHITE_Y = 1;

/**
 * Score one candidate pair for one theme.
 * `ink` is the label colour that theme forces: black on light, white on dark.
 */
function scorePair(hue, planS, planL, actS, actL, strokeS, strokeL, bgY, inkY) {
  var yPlan = lumOfHsl(hue, planS, planL);
  var yAct = lumOfHsl(hue, actS, actL);
  var yStroke = lumOfHsl(hue, strokeS, strokeL);
  var r = {
    inkOnPlan: contrast(inkY, yPlan),      // WCAG 1.4.3, needs 4.5
    inkOnActual: contrast(inkY, yAct),     // WCAG 1.4.3, needs 4.5
    inkOnBg: contrast(inkY, bgY),          // labels outside the bar
    actualOverPlan: contrast(yAct, yPlan), // WCAG 1.4.11, needs 3
    strokeOverBg: contrast(yStroke, bgY),  // the outline that carries the shape
    planOverBg: contrast(yPlan, bgY)       // the fill must still read as a band
  };

           r.strokeOverBg >= 3 && r.planOverBg >= PLAN_OVER_BG_MIN;
  return r;

/**
 * The plan fill sits deliberately close to the background -- its outline is
 * what carries the shape (2-6). But it must not vanish into it, or the bar
 * becomes an empty outline and the plan/actual pair stops reading as one
 * object. The settled palette sits at 1.7:1, so 1.3:1 is a floor, not a goal.
 */

/**
 * Search the lightness of plan and actual for one hue so that black-on-light
 * and white-on-dark both hold. Returns null when the hue admits no solution.
 * Saturation is swept too, because a very saturated colour cannot reach the
 * luminance the text contrast demands.
 */
function solveHue(hue, theme) {
  var dark = theme === "dark";
  var bgY = dark ? luminance([0.078, 0.086, 0.102]) : 1;   // #14161a / #ffffff
  var inkY = dark ? WHITE_Y : BLACK_Y;

  // that makes a fixed black / white label legal -- not for the largest
  // margin, which just drives the plan bar to pure white or pure black.
  var ref = dark ? { pl: 0.26, ps: 0.32, al: 0.64, as: 0.62 }
                 : { pl: 0.80, ps: 0.46, al: 0.34, as: 0.62 };
  var best = null;
  var planSs = [0.20, 0.28, 0.32, 0.36, 0.46, 0.56];
  var actSs = [0.40, 0.50, 0.62, 0.74, 0.86];
  var i, planLs = [];
  for (i = 0; i <= 100; i++) planLs.push(i / 100);

  planSs.forEach(function (ps) {
    planLs.forEach(function (pl) {
      actSs.forEach(function (as) {
        planLs.forEach(function (al) {
          // plan stays the paler of the two on light, the darker on dark
          if (!dark && al >= pl) return;
          if (dark && al <= pl) return;
          var strokeL = dark ? Math.min(0.95, al + 0.16) : Math.max(0.05, pl - 0.34);
          var r = scorePair(hue, ps, pl, as, al, ps + 0.1, strokeL, bgY, inkY);
          if (!r.pass) return;
          var move = Math.abs(pl - ref.pl) + Math.abs(al - ref.al) +
                     0.5 * Math.abs(ps - ref.ps) + 0.5 * Math.abs(as - ref.as);
          if (!best || move < best.move) {
            best = { hue: hue, planS: ps, planL: pl, actS: as, actL: al,
                     strokeS: ps + 0.1, strokeL: strokeL, move: move, score: r };
          }
        });
      });
    });
  });
  return best;
}

  { name: "青", hue: 214 },
  { name: "青緑", hue: 190 },
  { name: "緑", hue: 140 },
  { name: "黄緑", hue: 95 },
  { name: "黄", hue: 50 },
  { name: "橙", hue: 28 },
  { name: "赤", hue: 6 },
  { name: "赤紫", hue: 330 },
  { name: "紫", hue: 285 },
  { name: "藍", hue: 250 }

/* ---- theme -------------------------------------------------------------- */

/** Force a theme, or pass null to fall back to the OS preference. */

  if (forced) return forced;

  ENV: ENV,
  SPEC: SPEC,
  S: S,
  resetAll: resetAll,
  ranges: ranges,
  violations: violations,
  shapeRatio: shapeRatio,
  hasThickness: hasThickness,
  chevronNotchOfPlan: chevronNotchOfPlan,
  chevronNotchOfActual: chevronNotchOfActual,
  planFloor: planFloor,
  atFloor: atFloor,
  shapeMetrics: shapeMetrics,
  dependencyRunEntry: dependencyRunEntry,
  dependencyRunExit: dependencyRunExit,
  isFullWidth: isFullWidth,
  widthUnits: widthUnits,
  labelWidth: labelWidth,
  haloAttrs: haloAttrs,
  truncateUnits: truncateUnits,
  setTheme: setTheme,
  currentTheme: currentTheme,
  hslToRgb: hslToRgb,

  scorePair: scorePair,

<script>
// ---------------------------------------------------------------------------
// Shared PoC data. Copy verbatim. Do not modify.
// ---------------------------------------------------------------------------

/** Deterministic LCG so every PoC renders byte-identical input. */
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

var SHAPE_KINDS = ['rectangle', 'chevron', 'arrow', 'endpointSpan'];

/**
 * Layout stress cases. Each case becomes ONE TaskGroup (= one row).
 * t: [name, startDay, finishDay, shapeKind, milestone]
 * d: [fromIndex, toIndex, linkType]  (indices are local to the case)
 */
var LAYOUT_CASES = [
  { title: '1. 直列 FS 3 本',
    t: [['A', 0, 20, 'rectangle', false], ['B', 24, 44, 'rectangle', false], ['C', 48, 68, 'rectangle', false]],
    d: [[0, 1, 'FS'], [1, 2, 'FS']] },

  { title: '2. 逆行依存（右から左へ）',
    t: [['A', 60, 80, 'rectangle', false], ['B', 10, 30, 'rectangle', false], ['C', 100, 120, 'rectangle', false]],
    d: [[0, 1, 'FS'], [2, 0, 'FS']] },

  { title: '3. 同一行内で交差する 2 本',
    t: [['A', 0, 24, 'rectangle', false], ['B', 30, 54, 'rectangle', false],
        ['C', 60, 84, 'rectangle', false], ['D', 90, 114, 'rectangle', false]],
    d: [[0, 2, 'FS'], [1, 3, 'FS']] },

  { title: '4. 1 対 4 の扇形（出）',
    t: [['SRC', 0, 20, 'chevron', false], ['A', 30, 46, 'rectangle', false], ['B', 50, 66, 'rectangle', false],
        ['C', 70, 86, 'rectangle', false], ['D', 90, 106, 'rectangle', false]],
    d: [[0, 1, 'FS'], [0, 2, 'FS'], [0, 3, 'FS'], [0, 4, 'FS']] },

  { title: '5. 4 対 1 の扇形（入）',
    t: [['A', 0, 16, 'rectangle', false], ['B', 20, 36, 'rectangle', false], ['C', 40, 56, 'rectangle', false],
        ['D', 60, 76, 'rectangle', false], ['DST', 90, 110, 'chevron', false]],
    d: [[0, 4, 'FS'], [1, 4, 'FS'], [2, 4, 'FS'], [3, 4, 'FS']] },

  { title: '6. 完全結合（4 タスク 6 本）',
    t: [['A', 0, 20, 'rectangle', false], ['B', 26, 46, 'rectangle', false],
        ['C', 52, 72, 'rectangle', false], ['D', 78, 98, 'rectangle', false]],
    d: [[0, 1, 'FS'], [0, 2, 'FS'], [0, 3, 'FS'], [1, 2, 'FS'], [1, 3, 'FS'], [2, 3, 'FS']] },

  { title: '7. 3 段に積まれた行を跨ぐ依存',
    t: [['A', 0, 60, 'rectangle', false], ['B', 10, 70, 'rectangle', false], ['C', 20, 80, 'rectangle', false],
        ['D', 90, 110, 'rectangle', false]],
    d: [[0, 3, 'FS'], [1, 3, 'FS'], [2, 3, 'FS'], [0, 1, 'SS'], [1, 2, 'SS']] },

  { title: '8. マイルストーンへ集約',
    t: [['A', 0, 24, 'rectangle', false], ['B', 12, 40, 'rectangle', false], ['C', 28, 56, 'rectangle', false],
        ['M', 62, 62, 'milestone', true]],
    d: [[0, 3, 'FS'], [1, 3, 'FS'], [2, 3, 'FS']] },

  { title: '9. 同一開始日の 5 タスク',
    t: [['A', 20, 44, 'rectangle', false], ['B', 20, 40, 'rectangle', false], ['C', 20, 36, 'rectangle', false],
        ['D', 20, 32, 'rectangle', false], ['E', 20, 28, 'rectangle', false]],
    d: [[4, 0, 'SS'], [3, 0, 'SS'], [2, 0, 'SS'], [1, 0, 'SS']] },

  { title: '10. 隣接（finish == start）',
    t: [['A', 0, 30, 'rectangle', false], ['B', 30, 60, 'rectangle', false],
        ['C', 60, 90, 'rectangle', false], ['D', 90, 120, 'rectangle', false]],
    d: [[0, 1, 'FS'], [1, 2, 'FS'], [2, 3, 'FS']] },

  { title: '11. 長い名称がはみ出す',
    t: [['要件定義と外部仕様の確定', 0, 12, 'rectangle', false],
        ['詳細設計レビューの反映', 18, 30, 'rectangle', false],
        ['結合検証と是正', 36, 48, 'rectangle', false]],
    d: [[0, 1, 'FS'], [1, 2, 'FS']] },

  { title: '12. 幅がない形状種の混在',
    t: [['A', 0, 26, 'arrow', false], ['B', 32, 58, 'endpointSpan', false],
        ['C', 64, 90, 'chevron', false], ['M', 96, 96, 'milestone', true]],
    d: [[0, 1, 'FS'], [1, 2, 'FS'], [2, 3, 'FS'], [0, 2, 'FS']] },

  { title: '13. 予実＋進捗マーカー付きで配線',
    t: [['A', 0, 30, 'rectangle', false], ['B', 36, 66, 'rectangle', false],
        ['C', 72, 102, 'chevron', false], ['D', 40, 100, 'rectangle', false]],
    d: [[0, 1, 'FS'], [1, 2, 'FS'], [0, 3, 'SS'], [3, 2, 'FF']] },

  { title: '14. 密集（12 タスク・交差多数）',
    t: [['a', 0, 10, 'rectangle', false], ['b', 8, 20, 'rectangle', false], ['c', 16, 28, 'rectangle', false],
        ['d', 24, 36, 'rectangle', false], ['e', 32, 44, 'rectangle', false], ['f', 40, 52, 'rectangle', false],
        ['g', 48, 60, 'rectangle', false], ['h', 56, 68, 'rectangle', false], ['i', 64, 76, 'rectangle', false],
        ['j', 72, 84, 'rectangle', false], ['k', 80, 92, 'rectangle', false], ['l', 88, 100, 'rectangle', false]],
    d: [[0, 3, 'FS'], [1, 5, 'FS'], [2, 7, 'FS'], [3, 9, 'FS'], [4, 11, 'FS'],
        [0, 11, 'FS'], [6, 8, 'FS'], [8, 10, 'FS'], [5, 9, 'FS'], [7, 11, 'FS']] },

  { title: '15. 行を跨ぐ依存の受け口',
    t: [['X', 0, 24, 'rectangle', false], ['Y', 40, 64, 'rectangle', false], ['Z', 80, 104, 'rectangle', false]],
    d: [[0, 1, 'FS'], [1, 2, 'FS']] }
];

/** Cross-row links, given as [caseIndex, taskIndex] pairs. Exercise vertical routing. */
var CROSS_ROW_LINKS = [
  [[0, 2], [2, 0], 'FS'], [[3, 4], [5, 0], 'FS'], [[7, 3], [9, 0], 'FS'],
  [[5, 3], [13, 0], 'FS'], [[9, 3], [14, 0], 'FS'], [[11, 3], [14, 1], 'FS'],
  [[13, 2], [14, 2], 'FS'], [[1, 2], [6, 0], 'FS'], [[6, 3], [12, 0], 'FS']
];

/** Build the layout-stress dataset: one TaskGroup per case. */
function buildLayoutDataset() {
  var tasks = [], groups = [], links = [], uid = 1, idx = [];
  for (var c = 0; c < LAYOUT_CASES.length; c++) {
    var kase = LAYOUT_CASES[c], memberUids = [], local = [];
    for (var i = 0; i < kase.t.length; i++) {
      var row = kase.t[i];
      var dur = row[2] - row[1];
      var actualDur = Math.max(0, Math.round(dur * (0.3 + 0.5 * ((c + i) % 5) / 4)));
      tasks.push({
        uid: uid, name: row[0], groupId: 'G' + c,
        startDay: row[1], finishDay: row[2],
        milestone: row[4], shapeKind: row[3],
        wbsParentUid: null, wbsDepth: 1 + (i % 3),
        actualStartDay: row[1], actualDurationDays: actualDur,
        actualFinishDay: null,
        percentComplete: dur === 0 ? 0 : Math.min(100, Math.round((actualDur / dur) * 100)),
        stackOrder: null
      });
      memberUids.push(uid); local.push(uid); uid++;
    }
    idx.push(local);
    groups.push({ id: 'G' + c, title: kase.title, memberUids: memberUids });
    for (var k = 0; k < kase.d.length; k++) {
      links.push({ fromUid: local[kase.d[k][0]], toUid: local[kase.d[k][1]], linkType: kase.d[k][2] });
    }
  }
  for (var x = 0; x < CROSS_ROW_LINKS.length; x++) {
    var a = CROSS_ROW_LINKS[x][0], b = CROSS_ROW_LINKS[x][1];
    links.push({ fromUid: idx[a[0]][a[1]], toUid: idx[b[0]][b[1]], linkType: CROSS_ROW_LINKS[x][2] });
  }
  return { tasks: tasks, groups: groups, links: links };
}

/**
 * Build the zoom dataset: a large project with a 5-level WBS.
 * Level fan-out 5 / 4 / 3 / 2 / 2 -> 5 + 20 + 60 + 120 + 240 = 445 tasks.
 * Rows (TaskGroup) are the level-2 nodes, so 20 rows carry every leaf.
 */
function buildZoomDataset() {
  var rng = makeRng(20260730);
  var tasks = [], groups = [], links = [], uid = 1;
  var HORIZON = 720;                       // project spans 720 days
  var FANOUT = [5, 4, 3, 2, 2];
  var byDepth = [[], [], [], [], [], []];

  function make(depth, parentUid, s, f, label) {
    var t = {
      uid: uid++, name: label, groupId: null,
      startDay: s, finishDay: f, milestone: false, shapeKind: 'rectangle',
      wbsParentUid: parentUid, wbsDepth: depth,
      actualStartDay: s, actualDurationDays: Math.round((f - s) * (0.2 + rng() * 0.7)),
      actualFinishDay: null, percentComplete: 0, stackOrder: null
    };
    var dur = f - s;
    t.percentComplete = dur === 0 ? 0 : Math.min(100, Math.round(t.actualDurationDays / dur * 100));
    tasks.push(t); byDepth[depth].push(t);
    return t;
  }

  function split(node, depth) {
    if (depth > 5) return;
    var n = FANOUT[depth - 1];
    var span = node.finishDay - node.startDay;
    var seg = span / n;
    for (var i = 0; i < n; i++) {
      var s = Math.round(node.startDay + seg * i + seg * 0.05 * rng());
      var f = Math.round(node.startDay + seg * (i + 1) - seg * 0.10 * rng());
      if (f <= s) f = s + 1;
      var child = make(depth, node.uid, s, f, 'L' + depth + '-' + uid);
      split(child, depth + 1);
    }
  }

  for (var p = 0; p < FANOUT[0]; p++) {
    var s0 = Math.round(HORIZON / FANOUT[0] * p);
    var f0 = Math.round(HORIZON / FANOUT[0] * (p + 1)) - 4;
    var root = make(1, null, s0, f0, 'L1-' + (p + 1));
    split(root, 2);
  }

  // Rows: every depth-2 node becomes a TaskGroup holding its whole subtree.
  var byUid = {};
  for (var q = 0; q < tasks.length; q++) byUid[tasks[q].uid] = tasks[q];
  function rootGroupOf(t) {
    var cur = t;
    while (cur.wbsDepth > 2 && cur.wbsParentUid != null) cur = byUid[cur.wbsParentUid];
    return cur.wbsDepth === 2 ? cur.uid : null;
  }
  var groupMap = {};
  for (var r = 0; r < tasks.length; r++) {
    var g = rootGroupOf(tasks[r]);
    if (g == null) { tasks[r].groupId = 'ROOT'; continue; }
    tasks[r].groupId = 'G' + g;
    if (!groupMap['G' + g]) groupMap['G' + g] = { id: 'G' + g, title: byUid[g].name, memberUids: [] };
    groupMap['G' + g].memberUids.push(tasks[r].uid);
  }
  var rootGroup = { id: 'ROOT', title: 'L1', memberUids: [] };
  for (var r2 = 0; r2 < tasks.length; r2++) {
    if (tasks[r2].groupId === 'ROOT') rootGroup.memberUids.push(tasks[r2].uid);
  }
  groups.push(rootGroup);
  for (var key in groupMap) if (groupMap.hasOwnProperty(key)) groups.push(groupMap[key]);

  // Links: chain siblings at every depth (FS), plus a few long-range ones.
  for (var d = 1; d <= 5; d++) {
    var lvl = byDepth[d];
    for (var i2 = 1; i2 < lvl.length; i2++) {
      if (lvl[i2].wbsParentUid === lvl[i2 - 1].wbsParentUid) {
        links.push({ fromUid: lvl[i2 - 1].uid, toUid: lvl[i2].uid, linkType: 'FS' });
      }
    }
  }
  for (var j = 0; j < 40; j++) {
    var a2 = tasks[Math.floor(rng() * tasks.length)], b2 = tasks[Math.floor(rng() * tasks.length)];
    if (a2.uid !== b2.uid && a2.finishDay <= b2.startDay) {
      links.push({ fromUid: a2.uid, toUid: b2.uid, linkType: 'FS' });
    }
  }
  return { tasks: tasks, groups: groups, links: links };
}

// ---------------------------------------------------------------------------
// End of shared code. Everything below is variant B: "fit-first".
//
// Strategy: the viewport height is a fixed budget. We walk the WBS from depth 1
// downward and keep a whole depth only while the total required height still
// fits the budget. The deepest fully affordable depth is what gets drawn.
// Depth 1 is added first, so L1 is affordable by construction.
// ---------------------------------------------------------------------------

var NS = 'http://www.w3.org/2000/svg';

var HORIZON_DAYS = 720;
var MAX_JUDGE_DEPTH = 5;      // spec 3-6: clamp depth FOR JUDGEMENT ONLY
var S = POC_UI.S;
var M1 = POC_UI.shapeMetrics("rectangle", 1);
var GUTTER_W = S.rowTitleWidth;   // left column with row titles
var PAD_LEFT = 8;
var PAD_RIGHT = 18;
var AXIS_H = S.rulerH;
var MIN_LEVEL_H = 14;         // minimum legible height of ONE stack level (px)
var ROW_PAD_RATIO = 0.12;     // per side -> 24% total, spec 5 allows <= 25%
var EMPTY_ROW_H = 12;         // a row with nothing visible at this depth
var BAR_RATIO = 0.66;         // bar band inside one stack level; rest is routing gap
var MIN_GAP_PX = 6;           // horizontal clearance between two task occupancies
var MARK_SIZE = M1.markerSize; // progress marker: FIXED pixel size (spec 3-5)
var MARK_GAP = S.markerGap;    // FIXED 4px from the actual bar right edge
var STACK_GUARD = 40;         // safety valve only (spec 3-1 item 5)
var STRETCH_MAX = 3;          // cap on giving leftover budget back as row height
var ZX_MIN = 0.5, ZX_MAX = 40, ZY_MIN = 1, ZY_MAX = 6;

var DATA = buildZoomDataset();
var BY_UID = {};
for (var bi = 0; bi < DATA.tasks.length; bi++) BY_UID[DATA.tasks[bi].uid] = DATA.tasks[bi];

/** Rows in draw order: the ROOT group (all L1 tasks) first, then the 20 L2 groups. */
var ROWS = [];
(function buildRows() {
  for (var i = 0; i < DATA.groups.length; i++) {
    var g = DATA.groups[i];
    var members = [];
    for (var m = 0; m < g.memberUids.length; m++) members.push(BY_UID[g.memberUids[m]]);
    members.sort(function (a, b) { return a.startDay - b.startDay || a.uid - b.uid; });
    ROWS.push({ id: g.id, title: g.id === 'ROOT' ? 'L1 全体' : g.title, members: members });
  }
})();

/** Judgement-only depth clamp. The stored wbsDepth is never modified. */
function judgeDepth(t) { return t.wbsDepth < MAX_JUDGE_DEPTH ? t.wbsDepth : MAX_JUDGE_DEPTH; }

var VIEW = {
  zx: 1, zy: 1, scrollX: 0,
  plotW: 800, plotH: 600, fitPxPerDay: 1, budgetBarW: 452,
  showLinks: true, showAllMarkers: true,
  selectedUid: null, animating: false
};

// --- text helpers ----------------------------------------------------------

/** Rough full-width test; good enough for the approximate width formula. */
function isFullWidth(code) {
  if (code < 0x1100) return false;
  if (code >= 0xff61 && code <= 0xff9f) return false;   // half-width katakana
  return true;
}

/** Approximate width in "half-width units" (spec 3-3: no measuring, no cache). */
function textUnits(s) {
  var u = 0;
  for (var i = 0; i < s.length; i++) u += isFullWidth(s.charCodeAt(i)) ? 2 : 1;
  return u;
}

/** Truncate to 12 full-width / 24 half-width units (spec 3-3 item 2). */
function truncateUnits(s, maxUnits) {
  var u = 0, out = '';
  for (var i = 0; i < s.length; i++) {
    var w = isFullWidth(s.charCodeAt(i)) ? 2 : 1;
    if (u + w > maxUnits) return out + '…';
    u += w; out += s.charAt(i);
  }
  return out;
}

// --- layout ----------------------------------------------------------------

/**
 * Build one drawable item in CONTENT coordinates (x = day * pxPerDay).
 * Occupancy (ox0..ox1) includes the progress marker and any label pushed right.
 */
function makeItem(t, pxPerDay, levelH) {
  var barH = levelH * BAR_RATIO;
  var x0 = t.startDay * pxPerDay;
  var x1 = t.finishDay * pxPerDay;
  var wide = (t.shapeKind === 'rectangle' || t.shapeKind === 'chevron');
  if (t.milestone) { x0 = x1 - barH * 0.5; x1 = x1 + barH * 0.5; }
  var w = x1 - x0;

  var actEnd = t.actualStartDay + t.actualDurationDays;
  var ax0 = t.actualStartDay * pxPerDay;
  var ax1 = actEnd * pxPerDay;

  var fontSize = Math.max(10, Math.round(barH * 0.8));
  var full = t.name;
  var wFull = textUnits(full) * fontSize / 2;
  var label = full, labelInside = true;
  if (wFull > w - 6) {
    var cut = truncateUnits(full, 24);
    var wCut = textUnits(cut) * fontSize / 2;
    label = cut;
    labelInside = (wCut <= w - 6);
    wFull = wCut;
  }

  var ox0 = Math.min(x0, ax0);
  var ox1 = Math.max(x1, ax1 + MARK_GAP + MARK_SIZE);
  if (!labelInside) ox1 = ox1 + 4 + wFull;

  return {
    t: t, x0: x0, x1: x1, ax0: ax0, ax1: ax1, wide: wide,
    ox0: ox0, ox1: ox1, label: label, labelInside: labelInside,
    fontSize: fontSize, level: 0, y: 0, barH: barH
  };
}

function compareForStack(a, b) {
  if (a.t.milestone !== b.t.milestone) return a.t.milestone ? -1 : 1;
  if (a.t.startDay !== b.t.startDay) return a.t.startDay - b.t.startDay;
  if (a.t.finishDay !== b.t.finishDay) return b.t.finishDay - a.t.finishDay;
  return a.t.uid - b.t.uid;
}

/**
 * Greedy stack assignment (spec 3-1). Never reuses the last level to squeeze
 * overlapping items in; a new level is always added instead.
 */
function assignStacks(items) {
  items.sort(compareForStack);
  var levels = [];
  var guardHit = false;
  for (var i = 0; i < items.length; i++) {
    var it = items[i], placed = false;
    for (var L = 0; L < levels.length; L++) {
      var arr = levels[L], clash = false;
      for (var k = 0; k < arr.length; k++) {
        if (it.ox0 < arr[k].ox1 + MIN_GAP_PX && arr[k].ox0 < it.ox1 + MIN_GAP_PX) { clash = true; break; }
      }
      if (!clash) { arr.push(it); it.level = L; placed = true; break; }
    }
    if (!placed) {
      if (levels.length >= STACK_GUARD) { guardHit = true; it.level = levels.length - 1; levels[levels.length - 1].push(it); }
      else { it.level = levels.length; levels.push([it]); }
    }
    it.t.stackOrder = it.level;
  }
  return { count: levels.length, levels: levels, guardHit: guardHit };
}

/** Lay out every row for a candidate depth D and report the height it costs. */
function layoutForDepth(D, pxPerDay, levelH) {
  var rowPad = levelH * ROW_PAD_RATIO;
  var out = [], total = 0, maxStack = 0, drawn = 0, guardHit = false;
  for (var r = 0; r < ROWS.length; r++) {
    var members = ROWS[r].members, items = [];
    for (var i = 0; i < members.length; i++) {
      if (judgeDepth(members[i]) <= D) items.push(makeItem(members[i], pxPerDay, levelH));
    }
    var st = { count: 0, guardHit: false };
    if (items.length) st = assignStacks(items);
    var h = items.length ? st.count * levelH + rowPad * 2 : EMPTY_ROW_H;
    if (st.guardHit) guardHit = true;
    if (st.count > maxStack) maxStack = st.count;
    drawn += items.length;
    out.push({ row: ROWS[r], items: items, stackCount: st.count, height: h, pad: rowPad });
    total += h;
  }
  return { depth: D, rows: out, total: total, maxStack: maxStack, drawn: drawn, guardHit: guardHit };
}

/**
 * fit-first: spend the vertical budget from depth 1 downward.
 * A depth is taken WHOLE or not at all.
 */
function computeLayout(zx, zy, plotW, plotH) {
  var pxPerDay = VIEW.fitPxPerDay * zx;
  var levelH = MIN_LEVEL_H * zy;
  var budget = plotH;
  var trials = [], cut = 1, chosen = null;
  for (var D = 1; D <= MAX_JUDGE_DEPTH; D++) {
    var trial = layoutForDepth(D, pxPerDay, levelH);
    trials.push(trial);
    if (D === 1) { chosen = trial; cut = 1; continue; }
    if (trial.total <= budget) { chosen = trial; cut = D; }
    else break;                       // deeper levels can only be taller
  }
  // The cut is decided at the MINIMUM legible level height. Whatever budget is
  // left over is given back as extra level height, so the screen is not left
  // half empty. Bigger text can widen labels and add stacks, so every candidate
  // stretch is re-checked against the budget and the largest fitting one wins.
  var stretch = 1;
  if (chosen.total > 0 && budget / chosen.total > 1.02) {
    var want = Math.min(STRETCH_MAX, budget / chosen.total);
    var cands = [want, 1 + (want - 1) * 0.7, 1 + (want - 1) * 0.4, 1 + (want - 1) * 0.2];
    for (var ci = 0; ci < cands.length; ci++) {
      var re = layoutForDepth(cut, pxPerDay, levelH * cands[ci]);
      if (re.total <= budget) { chosen = re; stretch = cands[ci]; levelH = levelH * cands[ci]; break; }
    }
  }

  // Assign y positions to the chosen depth.
  var y = 0;
  for (var r = 0; r < chosen.rows.length; r++) {
    var rr = chosen.rows[r];
    rr.y = y;
    for (var i = 0; i < rr.items.length; i++) {
      var it = rr.items[i];
      it.y = y + rr.pad + it.level * levelH;
    }
    y += rr.height;
  }
  return {
    pxPerDay: pxPerDay, levelH: levelH, budget: budget, cut: cut, stretch: stretch,
    judgeLevelH: MIN_LEVEL_H * zy,
    trials: trials, rows: chosen.rows, total: chosen.total,
    maxStack: chosen.maxStack, drawn: chosen.drawn,
    guardHit: chosen.guardHit, overflow: chosen.total > budget,
    contentW: HORIZON_DAYS * pxPerDay + PAD_RIGHT
  };
}

// --- dependency routing ----------------------------------------------------

/** Rect of the plan shape of an item (content coordinates). */
function itemRect(it) {
  var band = it.barH;
  var top = it.y + (it.wide ? 0 : 0);
  var h = it.wide ? band : band * 0.55;
  return { x0: it.x0, x1: it.x1, y0: top, y1: top + h, yc: top + h / 2 };
}

/**
 * 9-anchor routing with 0..3 bends (spec 3-4). All segments are axis aligned.
 * Forward + same level -> straight. Forward -> Z (2 bends).
 * Backward -> exit left / enter right (2 bends), or drop into the routing gap
 * below the level when both ends sit on the same level (2 bends, corner anchors).
 */
function routeLink(a, b, levelH) {
  var K = Math.max(6, levelH * 0.35);
  var sameY = Math.abs(a.yc - b.yc) < 0.6;
  if (b.x0 >= a.x1 + MIN_GAP_PX) {
    if (sameY) return [[a.x1, a.yc], [b.x0, b.yc]];
    var mx = (a.x1 + b.x0) / 2;
    if (mx < a.x1 + K) mx = a.x1 + K;
    if (mx > b.x0 - K) mx = b.x0 - K;
    if (mx < a.x1) mx = a.x1;
    return [[a.x1, a.yc], [mx, a.yc], [mx, b.yc], [b.x0, b.yc]];
  }
  if (sameY) {
    var yg = a.y1 + (levelH - (a.y1 - a.y0)) * 0.45;
    return [[a.x0 + 2, a.y1], [a.x0 + 2, yg], [b.x1 - 2, yg], [b.x1 - 2, b.y1]];
  }
  var lx = Math.min(a.x0, b.x1) - K;
  return [[a.x0, a.yc], [lx, a.yc], [lx, b.yc], [b.x1, b.yc]];
}

function buildRoutes(model) {
  var pos = {};
  for (var r = 0; r < model.rows.length; r++) {
    var items = model.rows[r].items;
    for (var i = 0; i < items.length; i++) pos[items[i].t.uid] = itemRect(items[i]);
  }
  var routes = [], bends = 0;
  if (VIEW.showLinks) {
    for (var k = 0; k < DATA.links.length; k++) {
      var L = DATA.links[k];
      var a = pos[L.fromUid], b = pos[L.toUid];
      if (!a || !b) continue;
      var pts = routeLink(a, b, model.levelH);
      routes.push({ pts: pts, from: L.fromUid, to: L.toUid, type: L.linkType });
      bends += Math.max(0, pts.length - 2);
    }
  }
  return { routes: routes, bends: bends, pos: pos };
}

// --- metrics ---------------------------------------------------------------

function segHitsRect(x1, y1, x2, y2, r) {
  var a = x1 < x2 ? x1 : x2, b = x1 < x2 ? x2 : x1;
  var c = y1 < y2 ? y1 : y2, d = y1 < y2 ? y2 : y1;
  return a <= r.x1 && b >= r.x0 && c <= r.y1 && d >= r.y0;
}

function segCross(p, q, u, v) {
  var pH = Math.abs(p[1] - q[1]) < 0.001, uH = Math.abs(u[1] - v[1]) < 0.001;
  if (pH === uH) return false;                      // parallel: not counted
  var h = pH ? [p, q] : [u, v];
  var w = pH ? [u, v] : [p, q];
  var hx0 = Math.min(h[0][0], h[1][0]), hx1 = Math.max(h[0][0], h[1][0]);
  var wy0 = Math.min(w[0][1], w[1][1]), wy1 = Math.max(w[0][1], w[1][1]);
  return w[0][0] > hx0 && w[0][0] < hx1 && h[0][1] > wy0 && h[0][1] < wy1;
}

function computeMetrics(model, routing, heavy) {
  var m = { overlap: 0, lineIcon: 0, lineLine: 0, density: 0 };
  var rects = [], bandArea = 0, taskArea = 0;
  for (var r = 0; r < model.rows.length; r++) {
    var rr = model.rows[r], items = rr.items;
    bandArea += rr.height * model.contentW;
    // overlap: same row, same stack level, plan rects touching
    var byLevel = {};
    for (var i = 0; i < items.length; i++) {
      var rc = itemRect(items[i]);
      rects.push({ uid: items[i].t.uid, x0: rc.x0, x1: rc.x1, y0: rc.y0, y1: rc.y1 });
      taskArea += (rc.x1 - rc.x0) * (rc.y1 - rc.y0);
      var L = items[i].level;
      if (!byLevel[L]) byLevel[L] = [];
      byLevel[L].push(rc);
    }
    for (var key in byLevel) {
      if (!byLevel.hasOwnProperty(key)) continue;
      var arr = byLevel[key];
      arr.sort(function (a, b) { return a.x0 - b.x0; });
      for (var j = 1; j < arr.length; j++) if (arr[j].x0 < arr[j - 1].x1) m.overlap++;
    }
  }
  m.density = bandArea > 0 ? taskArea / bandArea : 0;

  if (heavy) {
    var segs = [];
    for (var k = 0; k < routing.routes.length; k++) {
      var pts = routing.routes[k].pts, rt = routing.routes[k];
      for (var s = 0; s + 1 < pts.length; s++) {
        segs.push({ p: pts[s], q: pts[s + 1], from: rt.from, to: rt.to });
      }
    }
    for (var s1 = 0; s1 < segs.length; s1++) {
      var sg = segs[s1];
      for (var t1 = 0; t1 < rects.length; t1++) {
        var rc2 = rects[t1];
        if (rc2.uid === sg.from || rc2.uid === sg.to) continue;
        if (segHitsRect(sg.p[0], sg.p[1], sg.q[0], sg.q[1], rc2)) m.lineIcon++;
      }
    }
    for (var a1 = 0; a1 < segs.length; a1++) {
      for (var b1 = a1 + 1; b1 < segs.length; b1++) {
        if (segCross(segs[a1].p, segs[a1].q, segs[b1].p, segs[b1].q)) m.lineLine++;
      }
    }
  } else {
    m.lineIcon = -1; m.lineLine = -1;
  }
  return m;
}

// --- rendering -------------------------------------------------------------

function el(name, attrs) {
  var n = document.createElementNS(NS, name);
  if (attrs) for (var k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
  return n;
}

var START_DATE = new Date(2026, 0, 1);
var WEEKDAY = ['日', '月', '火', '水', '木', '金', '土'];

function dateOfDay(day) {
  var d = new Date(START_DATE.getTime());
  d.setDate(d.getDate() + day);
  return d;
}

function axisGranularity(pxPerDay) {
  if (pxPerDay >= 6) return 'md';
  if (pxPerDay >= 0.9) return 'ym';
  return 'y';
}

/** Build the time-axis header. Granularity follows the horizontal zoom. */
function buildAxis(model, day0, day1) {
  var g = el('g', {});
  var gran = axisGranularity(model.pxPerDay);
  var px = model.pxPerDay;
  var majors = [], minors = [], grid = [];
  var d = dateOfDay(Math.max(0, Math.floor(day0)));
  var startY = d.getFullYear(), startM = d.getMonth();

  function dayOf(dt) { return Math.round((dt.getTime() - START_DATE.getTime()) / 86400000); }

  if (gran === 'y') {
    for (var y = startY; y <= startY + 5; y++) {
      var a = dayOf(new Date(y, 0, 1)), b = dayOf(new Date(y + 1, 0, 1));
      if (b < day0 || a > day1) continue;
      majors.push({ a: a, b: b, text: y + '年' });
      grid.push(a);
    }
  } else if (gran === 'ym') {
    for (var yy = startY; yy <= startY + 5; yy++) {
      var ay = dayOf(new Date(yy, 0, 1)), by = dayOf(new Date(yy + 1, 0, 1));
      if (by < day0 || ay > day1) continue;
      majors.push({ a: ay, b: by, text: yy + '年' });
    }
    var cur = new Date(startY, startM, 1);
    for (var i = 0; i < 40; i++) {
      var a2 = dayOf(cur), nx = new Date(cur.getFullYear(), cur.getMonth() + 1, 1), b2 = dayOf(nx);
      if (a2 > day1) break;
      if (b2 >= day0) {
        minors.push({ a: a2, b: b2, text: (cur.getMonth() + 1) + '月' });
        grid.push(a2);
      }
      cur = nx;
    }
  } else {
    var cm = new Date(startY, startM, 1);
    for (var j = 0; j < 40; j++) {
      var am = dayOf(cm), nm = new Date(cm.getFullYear(), cm.getMonth() + 1, 1), bm = dayOf(nm);
      if (am > day1) break;
      if (bm >= day0) majors.push({ a: am, b: bm, text: cm.getFullYear() + '年' + (cm.getMonth() + 1) + '月' });
      cm = nm;
    }
    var step = px >= 24 ? 1 : (px >= 12 ? 2 : 7);
    var dstart = Math.max(0, Math.floor(day0 / step) * step);
    for (var dd = dstart; dd <= day1 && dd <= HORIZON_DAYS; dd += step) {
      var dt = dateOfDay(dd);
      var txt = dt.getDate() + (px >= 16 ? '\n' + WEEKDAY[dt.getDay()] : '');
      minors.push({ a: dd, b: dd + step, text: px >= 16 ? dt.getDate() + WEEKDAY[dt.getDay()] : String(dt.getDate()) });
      grid.push(dd);
    }
  }
  return { majors: majors, minors: minors, grid: grid, gran: gran };
}

/** Progress marker (spec 3-5). FIXED pixel size, drawn in SVG, never scaled. */
function markerNode(kind, cx, cy) {
  var g = el('g', {});
  var h = MARK_SIZE / 2;
  g.appendChild(el('rect', {
    x: cx - h, y: cy - h, width: MARK_SIZE, height: MARK_SIZE, rx: 1.5,
    fill: 'var(--bg)', stroke: 'var(--marker-ink)', 'stroke-width': 1
  }));
  if (kind === 'done') {
    g.appendChild(el('path', {
      d: 'M' + (cx - h + 2) + ',' + cy + ' L' + (cx - 0.5) + ',' + (cy + h - 2.5) + ' L' + (cx + h - 1.5) + ',' + (cy - h + 2),
      fill: 'none', stroke: 'var(--good)', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
    }));
  } else if (kind === 'over') {
    g.appendChild(el('path', {
      d: 'M' + cx + ',' + (cy - h + 2) + ' L' + cx + ',' + (cy + 1),
      stroke: 'var(--bad)', 'stroke-width': 1.8, 'stroke-linecap': 'round'
    }));
    g.appendChild(el('rect', { x: cx - 0.9, y: cy + 2.2, width: 1.8, height: 1.8, fill: 'var(--bad)' }));
  } else if (kind === 'susp') {
    g.appendChild(el('path', {
      d: 'M' + (cx - h + 2) + ',' + (cy - h + 2) + ' L' + (cx + h - 2) + ',' + (cy + h - 2),
      stroke: 'var(--warn)', 'stroke-width': 1.8, 'stroke-linecap': 'round'
    }));
  }
  return g;
}

function markerKind(t) {
  var actEnd = t.actualStartDay + t.actualDurationDays;
  if (actEnd > t.finishDay) return 'over';
  if (t.percentComplete >= 100) return 'done';
  return 'open';
}

function render(model, routing, axis, scrollX) {
  var svg = document.getElementById('canvas');
  var frag = document.createDocumentFragment();

  var defs = el('defs', {});
  var mk = el('marker', {
    id: 'ah', viewBox: '0 0 6 6', refX: '5.4', refY: '3',
    markerWidth: '5', markerHeight: '5', orient: 'auto-start-reverse'
  });
  mk.appendChild(el('path', { d: 'M0,0 L6,3 L0,6 z', fill: 'var(--dep)' }));
  defs.appendChild(mk);
  var pat = el('pattern', { id: 'hatch', width: '5', height: '5', patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
  pat.appendChild(el('rect', { width: '5', height: '5', fill: 'var(--actual-fill)' }));
  pat.appendChild(el('path', { d: 'M0,0 L0,5', stroke: 'var(--sub)', 'stroke-width': '2' }));
  defs.appendChild(pat);
  var clip = el('clipPath', { id: 'plotclip' });
  clip.appendChild(el('rect', { x: GUTTER_W, y: AXIS_H, width: Math.max(0, VIEW.plotW + PAD_LEFT), height: Math.max(0, VIEW.plotH) }));
  defs.appendChild(clip);
  frag.appendChild(defs);

  var originX = GUTTER_W + PAD_LEFT - scrollX;

  // 1. row bands (full width, never scrolled vertically -- there is no v-scroll)
  var gBands = el('g', { transform: 'translate(0,' + AXIS_H + ')' });
  for (var r = 0; r < model.rows.length; r++) {
    var rr = model.rows[r];
    gBands.appendChild(el('rect', {
      x: 0, y: rr.y, width: '100%', height: Math.max(0, rr.height - 0.5),
      fill: (r % 2 === 0) ? 'var(--bg)' : 'var(--row-alt)'
    }));
    gBands.appendChild(el('line', {
      x1: 0, y1: rr.y + rr.height, x2: '100%', y2: rr.y + rr.height,
      stroke: 'var(--rule)', 'stroke-width': 1
    }));
  }
  frag.appendChild(gBands);

  // 2. plot content (clipped, horizontally scrolled)
  var gPlot = el('g', { 'clip-path': 'url(#plotclip)' });
  var gInner = el('g', { transform: 'translate(' + originX + ',' + AXIS_H + ')' });

  // vertical grid
  for (var gi = 0; gi < axis.grid.length; gi++) {
    var gx = axis.grid[gi] * model.pxPerDay;
    gInner.appendChild(el('line', {
      x1: gx, y1: 0, x2: gx, y2: model.total, stroke: 'var(--rule)', 'stroke-width': 1
    }));
  }

  // dependency lines first, so task shapes stay readable on top
  var gLinks = el('g', { fill: 'none', stroke: 'var(--dep)', 'stroke-width': 1.1, 'stroke-linejoin': 'round' });
  for (var li = 0; li < routing.routes.length; li++) {
    var pts = routing.routes[li].pts, dstr = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
    for (var pi = 1; pi < pts.length; pi++) dstr += ' L' + pts[pi][0].toFixed(1) + ',' + pts[pi][1].toFixed(1);
    gLinks.appendChild(el('path', { d: dstr, 'marker-end': 'url(#ah)' }));
  }
  gInner.appendChild(gLinks);

  // tasks
  var gTasks = el('g', {});
  for (var r2 = 0; r2 < model.rows.length; r2++) {
    var items = model.rows[r2].items;
    for (var i2 = 0; i2 < items.length; i2++) {
      var it = items[i2], t = it.t;
      var w = Math.max(1, it.x1 - it.x0);
      var band = it.barH;
      var sel = (VIEW.selectedUid === t.uid);
      var g1 = el('g', {});

      var planH, planY, actY, actH;
      if (it.wide) {
        planH = band; planY = it.y;
        actH = band * 0.46; actY = it.y + (band - actH) / 2;
      } else {
        planH = band * 0.55; planY = it.y;
        actH = band * 0.34; actY = it.y + band * 0.62;   // height always reserved
      }

      if (t.milestone) {
        var cx0 = (it.x0 + it.x1) / 2, cy0 = it.y + band / 2, hh = band / 2;
        g1.appendChild(el('path', {
          d: 'M' + cx0 + ',' + (cy0 - hh) + ' L' + (cx0 + hh) + ',' + cy0 + ' L' + cx0 + ',' + (cy0 + hh) + ' L' + (cx0 - hh) + ',' + cy0 + ' z',
          fill: 'var(--plan-fill)', stroke: sel ? 'var(--plan-stroke)' : 'var(--plan-stroke)', 'stroke-width': sel ? 2 : 1
        }));
      } else if (t.shapeKind === 'chevron') {
        var nose = Math.min(w * 0.25, planH * 0.6);
        g1.appendChild(el('path', {
          d: 'M' + it.x0 + ',' + planY + ' L' + (it.x1 - nose) + ',' + planY +
             ' L' + it.x1 + ',' + (planY + planH / 2) + ' L' + (it.x1 - nose) + ',' + (planY + planH) +
             ' L' + it.x0 + ',' + (planY + planH) + ' z',
          fill: 'var(--plan-fill)', stroke: sel ? 'var(--plan-stroke)' : 'var(--plan-stroke)', 'stroke-width': sel ? 2 : 1
        }));
      } else if (t.shapeKind === 'arrow') {
        g1.appendChild(el('path', {
          d: 'M' + it.x0 + ',' + (planY + planH / 2) + ' L' + it.x1 + ',' + (planY + planH / 2),
          stroke: sel ? 'var(--plan-stroke)' : 'var(--plan-stroke)', 'stroke-width': 2, 'marker-end': 'url(#ah)'
        }));
      } else if (t.shapeKind === 'endpointSpan') {
        g1.appendChild(el('path', {
          d: 'M' + it.x0 + ',' + planY + ' L' + it.x0 + ',' + (planY + planH) +
             ' M' + it.x0 + ',' + (planY + planH / 2) + ' L' + it.x1 + ',' + (planY + planH / 2) +
             ' M' + it.x1 + ',' + planY + ' L' + it.x1 + ',' + (planY + planH),
          stroke: sel ? 'var(--plan-stroke)' : 'var(--plan-stroke)', 'stroke-width': 1.6, fill: 'none'
        }));
      } else {
        g1.appendChild(el('rect', {
          x: it.x0, y: planY, width: w, height: planH, rx: 1.5,
          fill: 'var(--plan-fill)', stroke: sel ? 'var(--plan-stroke)' : 'var(--plan-stroke)', 'stroke-width': sel ? 2 : 1
        }));
      }

      // actual bar: inside for wide shapes, below for the others
      var aw = Math.max(0.8, it.ax1 - it.ax0);
      if (t.actualDurationDays > 0) {
        g1.appendChild(el('rect', {
          x: it.ax0, y: actY, width: aw, height: Math.max(1.5, actH), rx: 1,
          fill: 'url(#hatch)', stroke: 'var(--actual-fill)', 'stroke-width': 0.6
        }));
      }

      // progress marker: fixed size, fixed 4px offset, included in occupancy
      var kind = markerKind(t);
      if (VIEW.showAllMarkers || kind !== 'open' || sel) {
        g1.appendChild(markerNode(kind, it.ax1 + MARK_GAP + MARK_SIZE / 2, actY + Math.max(1.5, actH) / 2));
      }

      // label
      var fs = it.fontSize;
      var ty = it.y + band / 2 + fs * 0.35;
      if (it.labelInside) {
        g1.appendChild(txt(it.label, it.x0 + 3, ty, fs, 'var(--ink)'));
      } else {
        g1.appendChild(txt(it.label, it.x1 + 4 + (t.actualDurationDays > 0 ? MARK_GAP + MARK_SIZE : 0), ty, fs, 'var(--label-ink)'));
      }
      gTasks.appendChild(g1);
    }
  }
  gInner.appendChild(gTasks);
  gPlot.appendChild(gInner);
  frag.appendChild(gPlot);

  // 3. left gutter with row titles (opaque, drawn on top)
  var gGut = el('g', { transform: 'translate(0,' + AXIS_H + ')' });
  gGut.appendChild(el('rect', { x: 0, y: 0, width: GUTTER_W, height: Math.max(0, model.total + 2), fill: 'var(--panel)' }));
  for (var r3 = 0; r3 < model.rows.length; r3++) {
    var rw = model.rows[r3];
    var fsz = Math.min(12, Math.max(9, rw.height - 4));
    if (rw.items.length === 0) {
      gGut.appendChild(txt(rw.row.title + '（この深さでは非表示）', 6, rw.y + rw.height - 3, 9, 'var(--sub)'));
    } else {
      gGut.appendChild(txt(rw.row.title, 6, rw.y + Math.min(rw.height - 3, rw.pad + Math.min(12, model.levelH) * 0.85), fsz, 'var(--label-ink)'));
      if (rw.height >= 30) {
        gGut.appendChild(txt('×' + rw.stackCount + '段 / ' + rw.items.length + '件', 6, rw.y + rw.height - 4, 9, 'var(--sub)'));
      }
    }
  }
  gGut.appendChild(el('line', { x1: GUTTER_W, y1: 0, x2: GUTTER_W, y2: Math.max(0, model.total + 2), stroke: 'var(--rule)', 'stroke-width': 1 }));
  frag.appendChild(gGut);

  // 4. time axis header
  var gAxis = el('g', {});
  gAxis.appendChild(el('rect', { x: 0, y: 0, width: '100%', height: AXIS_H, fill: 'var(--panel)' }));
  var gAx = el('g', { transform: 'translate(' + originX + ',0)', 'clip-path': 'url(#axisclip)' });
  var clip2 = el('clipPath', { id: 'axisclip' });
  clip2.appendChild(el('rect', { x: GUTTER_W - originX, y: 0, width: Math.max(0, VIEW.plotW + PAD_LEFT), height: AXIS_H }));
  defs.appendChild(clip2);
  for (var mj = 0; mj < axis.majors.length; mj++) {
    var M = axis.majors[mj];
    var mx0 = M.a * model.pxPerDay, mx1 = M.b * model.pxPerDay;
    gAx.appendChild(el('line', { x1: mx0, y1: 2, x2: mx0, y2: AXIS_H, stroke: 'var(--rule)', 'stroke-width': 1 }));
    gAx.appendChild(txt(M.text, mx0 + 4, 14, 11, 'var(--label-ink)'));
  }
  for (var mn = 0; mn < axis.minors.length; mn++) {
    var N = axis.minors[mn];
    var nx0 = N.a * model.pxPerDay;
    gAx.appendChild(el('line', { x1: nx0, y1: 20, x2: nx0, y2: AXIS_H, stroke: 'var(--rule)', 'stroke-width': 1 }));
    gAx.appendChild(txt(N.text, nx0 + 3, 33, 10, 'var(--sub)'));
  }
  gAxis.appendChild(gAx);
  gAxis.appendChild(el('rect', { x: 0, y: 0, width: GUTTER_W, height: AXIS_H, fill: 'var(--panel)' }));
  gAxis.appendChild(txt('粒度: ' + ({ y: '年', ym: '年+月', md: '月+日曜' }[axis.gran]), 6, 18, 10, 'var(--sub)'));
  gAxis.appendChild(txt('1px = ' + (1 / model.pxPerDay).toFixed(2) + '日', 6, 33, 10, 'var(--sub)'));
  gAxis.appendChild(el('line', { x1: 0, y1: AXIS_H, x2: '100%', y2: AXIS_H, stroke: 'var(--rule)', 'stroke-width': 1 }));
  frag.appendChild(gAxis);

  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.appendChild(frag);
  return svg.getElementsByTagName('*').length;
}

function txt(s, x, y, size, fill) {
  var n = el('text', { x: x, y: y, 'font-size': size, fill: fill, 'font-family': 'inherit' });
  n.textContent = s;
  return n;
}

// --- acceptance test -------------------------------------------------------

/**
 * THE acceptance test: fully zoomed out, every depth-1 task must fit ONE screen.
 * Evaluated on a fresh layout at the minimum zoom, independent of the current view.
 */
function evaluateL1(zx, zy) {
  var m = computeLayout(zx, zy, VIEW.plotW, VIEW.plotH);
  var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, n = 0;
  for (var r = 0; r < m.rows.length; r++) {
    var items = m.rows[r].items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].t.wbsDepth !== 1) continue;
      n++;
      if (items[i].ox0 < x0) x0 = items[i].ox0;
      if (items[i].ox1 > x1) x1 = items[i].ox1;
      var rc = itemRect(items[i]);
      if (rc.y0 < y0) y0 = rc.y0;
      if (rc.y1 > y1) y1 = rc.y1;
    }
  }
  if (!n) return { pass: false, n: 0, w: 0, h: 0, cut: m.cut };
  var w = x1 - x0, h = y1 - y0;
  return {
    pass: (x1 <= VIEW.plotW) && (y1 <= VIEW.plotH) && n === 5,
    n: n, w: w, h: h, right: x1, bottom: y1, cut: m.cut, total: m.total, budget: m.budget
  };
}

// --- driver ----------------------------------------------------------------

var LAST = { model: null, routing: null, metrics: null, svgNodes: 0, layoutMs: 0, routeMs: 0, paintMs: 0, fps: 0 };
var fpsSamples = [];
var lastFrameTs = 0;

/**
 * Reading the stage size forces a synchronous style/layout flush, which costs
 * several ms right after the SVG was replaced. The size only changes on resize,
 * so it is measured there and cached, never inside the animation loop.
 */
function measureViewport() {
  var stage = document.getElementById('stage');
  var rc = stage.getBoundingClientRect();
  VIEW.plotW = Math.max(120, rc.width - GUTTER_W - PAD_LEFT - PAD_RIGHT);
  VIEW.plotH = Math.max(80, rc.height - AXIS_H);
  VIEW.fitPxPerDay = VIEW.plotW / HORIZON_DAYS;
  VIEW.budgetBarW = document.getElementById('bbar').clientWidth || 452;
}

function clampScroll(model) {
  var maxScroll = Math.max(0, model.contentW - VIEW.plotW);
  if (VIEW.scrollX > maxScroll) VIEW.scrollX = maxScroll;
  if (VIEW.scrollX < 0) VIEW.scrollX = 0;
}

function redraw(heavy) {
  var t0 = performance.now();
  var model = computeLayout(VIEW.zx, VIEW.zy, VIEW.plotW, VIEW.plotH);
  var t1 = performance.now();
  var routing = buildRoutes(model);
  var t2 = performance.now();
  clampScroll(model);
  var day0 = VIEW.scrollX / model.pxPerDay;
  var day1 = (VIEW.scrollX + VIEW.plotW) / model.pxPerDay;
  var axis = buildAxis(model, day0, day1);
  var nodes = render(model, routing, axis, VIEW.scrollX);
  var t3 = performance.now();
  var metrics = computeMetrics(model, routing, !!heavy);

  LAST.model = model; LAST.routing = routing; LAST.metrics = metrics;
  LAST.svgNodes = nodes;
  LAST.layoutMs = t1 - t0; LAST.routeMs = t2 - t1; LAST.paintMs = t3 - t2;
  // The panels are HTML, not the chart. During the animation they are refreshed
  // every 4th frame so the panel DOM churn is not charged to the chart's FPS.
  panelTick++;
  if (!VIEW.animating || panelTick % 4 === 0) updatePanels(heavy);
}
var panelTick = 0;

function fmt(v, d) { return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }

/** The acceptance verdict only depends on the viewport, so cache it per size. */
var ACC_CACHE = { key: '', value: null };
function acceptance() {
  var key = Math.round(VIEW.plotW) + 'x' + Math.round(VIEW.plotH);
  if (ACC_CACHE.key !== key) {
    ACC_CACHE.key = key;
    ACC_CACHE.value = evaluateL1(ZX_MIN, ZY_MIN);
  }
  return ACC_CACHE.value;
}

function updatePanels(heavy) {
  var m = LAST.model, mm = LAST.metrics;
  var acc = acceptance();
  var cur = { right: 0, bottom: 0 };
  for (var r = 0; r < m.rows.length; r++) {
    var items = m.rows[r].items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].t.wbsDepth !== 1) continue;
      if (items[i].ox1 > cur.right) cur.right = items[i].ox1;
      var rc = itemRect(items[i]);
      if (rc.y1 > cur.bottom) cur.bottom = rc.y1;
    }
  }
  var curFits = (cur.right - VIEW.scrollX <= VIEW.plotW) && (cur.bottom <= VIEW.plotH);

  var rows = [
    ['tasks', DATA.tasks.length, false],
    ['links', DATA.links.length, false],
    ['rows', ROWS.length, false],
    ['drawn', m.drawn, false],
    ['depthCut', 'L1..L' + m.cut + ' （丸ごと）', true],
    ['L1 fits screen', acc.pass ? 'yes' : 'no', true],
    ['svg nodes', LAST.svgNodes, false],
    ['layout ms', fmt(LAST.layoutMs, 2), false],
    ['route ms', fmt(LAST.routeMs, 2), false],
    ['paint ms', fmt(LAST.paintMs, 2), false],
    ['fps', LAST.fps ? fmt(LAST.fps, 1) : '-', false],
    ['overlap', mm.overlap, true],
    ['line×icon', mm.lineIcon < 0 ? '…' : mm.lineIcon, false],
    ['line×line', mm.lineLine < 0 ? '…' : mm.lineLine, false],
    ['bends', LAST.routing.bends, false],
    ['density', fmt(mm.density * 100, 1) + '%', true],
    ['maxStack', m.maxStack, false]
  ];
  var html = '';
  for (var k = 0; k < rows.length; k++) {
    var cls = '';
    if (rows[k][0] === 'overlap') cls = rows[k][1] === 0 ? 'good' : 'bad';
    if (rows[k][0] === 'L1 fits screen') cls = acc.pass ? 'good' : 'bad';
    html += '<tr' + (rows[k][2] ? ' class="hi"' : '') + '><td class="k">' + rows[k][0] +
            '</td><td class="v ' + cls + '">' + rows[k][1] + '</td></tr>';
  }
  document.getElementById('mtab').innerHTML = html;

  // budget bar
  var bar = document.getElementById('bbar');
  var w = VIEW.budgetBarW;      // cached: reading clientWidth here forces a layout flush
  var maxH = m.budget;
  for (var d2 = 0; d2 < m.trials.length; d2++) if (m.trials[d2].total > maxH) maxH = m.trials[d2].total;
  var scale = w / (maxH * 1.04);
  var old = bar.querySelectorAll('.bseg');
  for (var o = 0; o < old.length; o++) bar.removeChild(old[o]);
  var prev = 0, nums = '';
  // One ramp on the shared hue, so the depth shading follows the theme.
  var shades = ['hsl(var(--hue) 46% 34%)', 'hsl(var(--hue) 42% 44%)', 'hsl(var(--hue) 38% 54%)', 'hsl(var(--hue) 34% 64%)', 'hsl(var(--hue) 30% 74%)'];
  for (var d3 = 0; d3 < m.trials.length; d3++) {
    var tr = m.trials[d3];
    var seg = document.createElement('div');
    var inCut = (tr.depth <= m.cut);
    seg.className = 'bseg' + (inCut ? '' : ' out');
    seg.style.left = (prev * scale) + 'px';
    seg.style.width = Math.max(0, (tr.total - prev) * scale) + 'px';
    seg.style.background = inCut ? shades[d3] : 'repeating-linear-gradient(45deg,var(--rule) 0 4px,var(--panel) 4px 8px)';
    seg.textContent = 'L' + tr.depth;
    seg.title = 'L' + tr.depth + ' までの合計 ' + Math.round(tr.total) + 'px';
    bar.appendChild(seg);
    nums += 'L' + tr.depth + ' ' + Math.round(tr.total) + 'px' + (inCut ? '●' : '○') + '  ';
    prev = tr.total;
  }
  document.getElementById('blimit').style.left = (m.budget * scale) + 'px';
  var cutTotal = m.trials[m.cut - 1].total;
  document.getElementById('bcut').style.left = (cutTotal * scale) + 'px';
  document.getElementById('bnums').innerHTML =
    '予算(画面高) <b>' + Math.round(m.budget) + 'px</b> / 使用 <b>' +
    Math.round(m.total) + 'px</b> (' + fmt(m.total / m.budget * 100, 0) + '%) / 判定用の1段 ' +
    fmt(m.judgeLevelH, 1) + 'px → 実描画 ' + fmt(m.levelH, 1) + 'px（余りを段高へ ×' +
    fmt(m.stretch, 2) + '）<br>' + nums +
    (m.overflow ? ' <span class="bad">⚠ L1 だけでも予算超過</span>' : '') +
    (m.guardHit ? ' <span class="bad">⚠ 段数の安全弁に到達</span>' : '');

  // verdict
  var flag = document.getElementById('vflag');
  flag.textContent = acc.pass ? 'PASS' : 'FAIL';
  flag.className = 'flag ' + (acc.pass ? 'good' : 'bad');
  document.getElementById('vsub').textContent =
    '完全にズームアウト（横' + ZX_MIN + 'x / 縦' + ZY_MIN +
    'x）したとき、L1 の ' + acc.n + ' 件が 1 画面に収まるか。';
  document.getElementById('vnum').innerHTML =
    'L1 外接矩形 <b>' + Math.round(acc.w) + ' × ' + Math.round(acc.h) +
    ' px</b> / ビューポート <b>' + Math.round(VIEW.plotW) + ' × ' +
    Math.round(VIEW.plotH) + ' px</b><br>右端 ' + Math.round(acc.right) + 'px / 下端 ' +
    Math.round(acc.bottom) + 'px（両方がビューポート以内なら PASS）' +
    '<br>現在の表示での L1: ' + (curFits ? '収まっている' : 'はみ出し（ズームイン中）');
}

// --- interaction -----------------------------------------------------------

function setZoom(zx, zy) {
  VIEW.zx = Math.min(ZX_MAX, Math.max(ZX_MIN, zx));
  VIEW.zy = Math.min(ZY_MAX, Math.max(ZY_MIN, zy));
  document.getElementById('zx').value = VIEW.zx;
  document.getElementById('zy').value = VIEW.zy;
  document.getElementById('zxv').textContent = fmt(VIEW.zx, 1) + 'x';
  document.getElementById('zyv').textContent = fmt(VIEW.zy, 2) + 'x';
}

function scheduleRedraw(heavy) {
  redraw(heavy);
}

function onWheel(e) {
  e.preventDefault();
  var rc = document.getElementById('stage').getBoundingClientRect();
  var mx = e.clientX - rc.left - GUTTER_W - PAD_LEFT;
  if (e.ctrlKey) {
    var pxPerDay = VIEW.fitPxPerDay * VIEW.zx;
    var dayAt = (mx + VIEW.scrollX) / pxPerDay;
    var f = Math.exp(-e.deltaY * 0.0016);
    setZoom(VIEW.zx * f, VIEW.zy);
    var np = VIEW.fitPxPerDay * VIEW.zx;
    VIEW.scrollX = dayAt * np - mx;
  } else if (e.shiftKey) {
    setZoom(VIEW.zx, VIEW.zy * Math.exp(-e.deltaY * 0.0012));
  } else {
    VIEW.scrollX += e.deltaY + e.deltaX;
  }
  markFrame();
  scheduleRedraw(false);
  idleHeavy();
}

var idleTimer = null;
function idleHeavy() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(function () { LAST.fps = 0; redraw(true); }, 220);
}

function markFrame() {
  var now = performance.now();
  if (lastFrameTs) {
    var dt = now - lastFrameTs;
    if (dt > 0 && dt < 500) {
      fpsSamples.push(1000 / dt);
      if (fpsSamples.length > 40) fpsSamples.shift();
      var sum = 0;
      for (var i = 0; i < fpsSamples.length; i++) sum += fpsSamples[i];
      LAST.fps = sum / fpsSamples.length;
    }
  }
  lastFrameTs = now;
}

function autoZoom() {
  var btn = document.getElementById('auto');
  btn.disabled = true;
  VIEW.animating = true;
  var deltas = [];
  var t0 = performance.now(), prev = t0;
  var DURATION = 5000;
  var done = false;
  // Watchdog: requestAnimationFrame is paused in a hidden tab, so make sure the
  // button never stays disabled forever.
  var watchdog = setTimeout(function () {
    if (done) return;
    done = true; VIEW.animating = false; btn.disabled = false;
    document.getElementById('fpstext').textContent =
      'rAF が動かなかった（タブが非表示など）。ウィンドウを前面にして再実行してください。';
    document.getElementById('fpsbox').style.display = 'block';
  }, DURATION + 3000);
  function step(ts) {
    var el0 = ts - t0;
    var k = Math.min(1, el0 / DURATION);
    var wave = 0.5 - 0.5 * Math.cos(2 * Math.PI * k);         // 0 -> 1 -> 0
    setZoom(ZX_MIN + (18 - ZX_MIN) * wave, ZY_MIN + (2.6 - ZY_MIN) * wave);
    var mid = VIEW.plotW / 2;
    var pxPerDay = VIEW.fitPxPerDay * VIEW.zx;
    VIEW.scrollX = 360 * pxPerDay - mid;                       // keep mid-project centred
    markFrame();
    redraw(false);
    var d = ts - prev; prev = ts;
    if (d > 0 && d < 1000) deltas.push(d);
    if (el0 < DURATION) requestAnimationFrame(step);
    else {
      if (done) return;
      done = true; clearTimeout(watchdog);
      VIEW.animating = false;
      btn.disabled = false;
      reportFps(deltas);
      setZoom(1, 1); VIEW.scrollX = 0; redraw(true);
    }
  }
  requestAnimationFrame(step);
}

function reportFps(deltas) {
  if (!deltas.length) return;
  var fps = deltas.map(function (d) { return 1000 / d; }).sort(function (a, b) { return a - b; });
  function q(p) { return fps[Math.min(fps.length - 1, Math.floor(p * fps.length))]; }
  var sum = 0;
  for (var i = 0; i < fps.length; i++) sum += fps[i];
  var box = document.getElementById('fpsbox');
  box.style.display = 'block';
  var hist = document.getElementById('fpshist');
  hist.innerHTML = '';
  var bins = 12, lo = fps[0], hi = fps[fps.length - 1], span = Math.max(1, hi - lo);
  var counts = new Array(bins);
  for (var b = 0; b < bins; b++) counts[b] = 0;
  for (var j = 0; j < fps.length; j++) {
    var bi2 = Math.min(bins - 1, Math.floor((fps[j] - lo) / span * bins));
    counts[bi2]++;
  }
  var mx = 1;
  for (var c = 0; c < bins; c++) if (counts[c] > mx) mx = counts[c];
  for (var c2 = 0; c2 < bins; c2++) {
    var bar = document.createElement('div');
    bar.style.height = Math.round(counts[c2] / mx * 40) + 'px';
    bar.title = counts[c2] + ' frames';
    hist.appendChild(bar);
  }
  document.getElementById('fpstext').innerHTML =
    'frames ' + fps.length + ' / 平均 <b>' + fmt(sum / fps.length, 1) +
    ' fps</b><br>min ' + fmt(fps[0], 1) + ' / p5 ' + fmt(q(0.05), 1) + ' / 中央 ' +
    fmt(q(0.5), 1) + ' / p95 ' + fmt(q(0.95), 1) + ' / max ' + fmt(fps[fps.length - 1], 1) +
    '<br><span class="legend">横 ' + ZX_MIN + '→18x / 縦 1→2.6x を 5 秒で往復</span>';
}

function init() {
  var svg = document.getElementById('canvas');
  svg.addEventListener('wheel', onWheel, { passive: false });

  var dragging = false, lastX = 0;
  svg.addEventListener('mousedown', function (e) { dragging = true; lastX = e.clientX; svg.classList.add('drag'); });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    VIEW.scrollX -= (e.clientX - lastX);
    lastX = e.clientX;
    markFrame();
    scheduleRedraw(false);
  });
  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false; svg.classList.remove('drag'); idleHeavy();
  });

  svg.addEventListener('click', function (e) {
    var rc = svg.getBoundingClientRect();
    var cx = e.clientX - rc.left - GUTTER_W - PAD_LEFT + VIEW.scrollX;
    var cy = e.clientY - rc.top - AXIS_H;
    var hit = null, m = LAST.model;
    for (var r = 0; r < m.rows.length && !hit; r++) {
      var items = m.rows[r].items;
      for (var i = 0; i < items.length; i++) {
        var q2 = itemRect(items[i]);
        if (cx >= q2.x0 && cx <= q2.x1 && cy >= q2.y0 && cy <= q2.y1) { hit = items[i].t.uid; break; }
      }
    }
    VIEW.selectedUid = hit;
    redraw(true);
  });

  document.getElementById('zx').addEventListener('input', function (e) {
    setZoom(parseFloat(e.target.value), VIEW.zy); markFrame(); scheduleRedraw(false); idleHeavy();
  });
  document.getElementById('zy').addEventListener('input', function (e) {
    setZoom(VIEW.zx, parseFloat(e.target.value)); markFrame(); scheduleRedraw(false); idleHeavy();
  });
  document.getElementById('fit').addEventListener('click', doFit);
  document.getElementById('auto').addEventListener('click', autoZoom);
  document.getElementById('opt-links').addEventListener('change', function (e) {
    VIEW.showLinks = e.target.checked; redraw(true);
  });
  document.getElementById('opt-marks').addEventListener('change', function (e) {
    VIEW.showAllMarkers = e.target.checked; redraw(true);
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'f' || e.key === 'F') doFit();
  });
  window.addEventListener('resize', function () { measureViewport(); redraw(true); });

  initSideToggle();

  setZoom(1, 1);
  measureViewport();
  redraw(true);
}

/** Review overlay column: collapse / expand (presentation only). */
function initSideToggle() {
  var btn = document.getElementById('sideToggle');
  if (!btn) return;
  function apply(collapsed, notify) {
    var root = document.documentElement;
    if (collapsed) root.classList.add('side-collapsed');
    else root.classList.remove('side-collapsed');
    btn.textContent = collapsed ? 'パネル ▸' : 'パネル ▾';
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    if (notify) window.dispatchEvent(new Event('resize'));
  }
  btn.addEventListener('click', function () {
    apply(!document.documentElement.classList.contains('side-collapsed'), true);
  });
  apply(false, false);
}

function doFit() {
  setZoom(1, 1);
  VIEW.scrollX = 0;
  fpsSamples = []; LAST.fps = 0;
  redraw(true);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
