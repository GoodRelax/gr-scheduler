<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>live co-edit probe</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.7; margin: 24px; max-width: 760px; }
  h1 { font-size: 20px; }
  #status { padding: 8px 12px; border: 1px solid #999; border-radius: 6px; background: #f4f4f4; }
  #exposure { font-weight: bold; }
  .on { color: #1a6b2f; }
  .off { color: #8a1c1c; }
  textarea { width: 100%; height: 160px; font-size: 16px; line-height: 1.6; padding: 8px; box-sizing: border-box; }
  button { font-size: 16px; padding: 8px 16px; margin: 8px 0; }
  #log { border-top: 1px solid #ccc; padding-top: 8px; font-size: 14px; }
  #log div { padding: 2px 0; }
</style>
</head>
<body>

<h1>live co-edit probe</h1>

<p id="status">
  revision <span id="revision">0</span>
  / last edited by <span id="lastEditedBy">-</span>
  / agent interface: <span id="exposure" class="off">NOT EXPOSED</span>
</p>

<p>Shared document (type here as the human):</p>
<textarea id="documentText"></textarea>

<button id="enableButton">Enable AI co-editing</button>
<button id="disableButton">Disable</button>

<div id="log"></div>

<script type="module">
  // ---------------------------------------------------------------- state
  const state = {
    revision: 0,
    text: '',
    lastEditedBy: 'none',
  };

  const textArea = document.getElementById('documentText');
  const logBox = document.getElementById('log');
  const exposureLabel = document.getElementById('exposure');

  /**
   * Append one line to the on-screen log so the human can see what happened.
   *
   * @param {string} message - The line to show.
   */
  function log(message) {
    const line = document.createElement('div');
    line.textContent = new Date().toISOString().slice(11, 19) + '  ' + message;
    logBox.prepend(line);
  }

  /** Repaint the status line and the text area from state. */
  function paint() {
    document.getElementById('revision').textContent = String(state.revision);
    document.getElementById('lastEditedBy').textContent = state.lastEditedBy;
    if (textArea.value !== state.text) textArea.value = state.text;
  }

  // ------------------------------------------------------- agent interface
  // Module scope. Unreachable from outside unless placed on the global box.
  const agentApi = {
    agentApiVersion: '1.0.0',

    readDocument() {
      return { revision: state.revision, text: state.text, lastEditedBy: state.lastEditedBy };
    },

    /**
     * Write the document under an optimistic lock.
     *
     * @param {{baseRevision: number, text: string}} request - Proposed write.
     * @returns {object} Outcome, always including the current document.
     */
    applyText(request) {
      if (request.baseRevision !== state.revision) {
        log('agent write REJECTED (stale base revision ' + request.baseRevision +
            ', current ' + state.revision + ')');
        return {
          accepted: false,
          rejectionReason: 'stale-base-revision',
          expectedRevision: state.revision,
          document: this.readDocument(),
        };
      }
      state.text = request.text;
      state.revision += 1;
      state.lastEditedBy = 'agent';
      paint();
      log('agent wrote at revision ' + state.revision);
      return { accepted: true, revision: state.revision, document: this.readDocument() };
    },
  };

  // --------------------------------------------------- the enable switch
  // This is the D4 model: the interface is placed on the global box only when
  // the human asks for it on screen. Nothing in the file or in the document
  // decides this.
  document.getElementById('enableButton').addEventListener('click', () => {
    globalThis.grSchedulerAgentApi = agentApi;
    exposureLabel.textContent = 'EXPOSED';
    exposureLabel.className = 'on';
    log('human enabled AI co-editing');
  });

  document.getElementById('disableButton').addEventListener('click', () => {
    delete globalThis.grSchedulerAgentApi;
    exposureLabel.textContent = 'NOT EXPOSED';
    exposureLabel.className = 'off';
    log('human disabled AI co-editing (references already handed out still work)');
  });

  // ------------------------------------------------------- human editing
  textArea.addEventListener('input', () => {
    state.text = textArea.value;
    state.revision += 1;
    state.lastEditedBy = 'human';
    paint();
  });

  paint();
  log('page booted; interface is in module scope and has no name yet');
</script>

</body>
</html>
