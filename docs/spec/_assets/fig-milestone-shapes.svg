<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" role="img" aria-label="GRS milestone chart shapes: the 15 shapes of SH-5, each in the unit square with the center of its bounding box at the origin">
  <title>図 F-044 — マイルストーンの図形（チャート）</title>
  <style>
    svg { color: #1f2328; }
    .guide { fill: none; stroke: #8c959f; stroke-width: 0.75; stroke-dasharray: 3 3; }
    .body { fill: #dbe7f7; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round;
            vector-effect: non-scaling-stroke; }
    .inner { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round;
             stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .dot { fill: currentColor; stroke: none; }
    .shade { fill: currentColor; fill-opacity: 0.35; stroke: currentColor; stroke-width: 1.5;
             stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .lbl { fill: currentColor; opacity: 0.6; text-anchor: middle;
           font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           font-size: 9px; }
    @media (prefers-color-scheme: dark) { svg { color: #e6e8ea; } .body { fill: #2a323c; } }
  </style>
  <rect class="guide" x="10" y="14" width="52" height="52"/>
  <g transform="translate(36 40) scale(26)">
