  #panel[hidden] { display: none; }
  #panel:focus, .twrap:focus { outline: none; }
  #panel.minimised .pbody { display: none; }
  .phead { flex: none; height: var(--ph-h); display: flex; align-items: center; gap: 4px; padding: 0 6px 0 10px;

  .ptab .gl { font-family: Consolas, monospace; letter-spacing: -1px; }
  .pspace { flex: 1; }
  .pbtn { width: 30px; height: 28px; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer;
          font-family: Consolas, monospace; font-size: 15px; }

  .pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .psearch input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #hitcount { color: var(--ink2); white-space: nowrap; font-size: 13px; }

  table.st th { position: sticky; top: 0; z-index: 2; background: var(--head); text-align: left; font-weight: 700; padding-right: 2px; }

  table.st .fzlast { box-shadow: 2px 0 0 #9fb3cc; }
  table.st tr:hover td { background: #f5f8fc; }

  table.st td.jump:hover { text-decoration: underline; }
  table.st td.jump.empty { color: var(--ink2); font-style: italic; }
  table.st tr.cur td { background: #fdecea; }
  .thin { display: flex; align-items: center; gap: 2px; }
  .thin .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .fbtn { flex: none; width: 22px; height: 22px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; cursor: pointer; padding: 0;

  .fbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sorti { flex: none; font-size: 12px; color: var(--accent); }
  .rz { position: absolute; z-index: 11; touch-action: none; }
  #panel:not(.normal) .rz { display: none; }
  .rz.n, .rz.s { left: 0; right: 0; height: calc(var(--edge) * 2); cursor: ns-resize; }
  .rz.n { top: calc(var(--edge) * -1); } .rz.s { bottom: calc(var(--edge) * -1); }
  .rz.e, .rz.w { top: 0; bottom: 0; width: calc(var(--edge) * 2); cursor: ew-resize; }

  .rz.nw { top: calc(var(--edge) * -1); left: calc(var(--edge) * -1); cursor: nwse-resize; }
  .rz.se { bottom: calc(var(--edge) * -1); right: calc(var(--edge) * -1); cursor: nwse-resize; }

  scrollTop: $("sched").scrollTop, scrollLeft: $("sched").scrollLeft, pxPerDay, inset: SIZES.inset, t0: T0, fontPx: FONT_STEPS[fontStep]
});

renderWords();
renderAll();
</script>
