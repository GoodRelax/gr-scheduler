<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI co-work trial - shogi</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f2ee;
        --surface: #ffffff;
        --border: #c9ccd2;
        --text: #1c1e21;
        --muted: #5c626b;
        --board: #e8c98d;
        --board-line: #8a6b3a;
        --accent: #2b6a3f;
        --danger: #b3261e;
        --last: #ffe9a8;
        --pick: #a8d5b5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --surface: #202329;
          --border: #3a3f47;
          --text: #e7e9ec;
          --muted: #a2a8b2;
          --board: #b99a63;
          --board-line: #5c4726;
          --accent: #6fbf87;
          --danger: #ef7a72;
          --last: #cbab5f;
          --pick: #6f9f7e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.7;
      }
      .layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
      }
      h1 {
        font-size: 1.15em;
        margin: 0 0 4px;
      }
      .sub {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.85em;
      }
      /* --- board --- */
      .board {
        display: grid;
        grid-template-columns: repeat(9, 50px);
        grid-template-rows: repeat(9, 54px);
        background: var(--board);
        border: 2px solid var(--board-line);
        width: max-content;
      }
      .sq {
        border: 1px solid var(--board-line);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        font-size: 27px;
        line-height: 1;
        color: #1a1207;
        cursor: default;
      }
      .sq[data-clickable='true'] {
        cursor: pointer;
      }
      .sq[data-last='true'] {
        background: var(--last);
      }
      .sq[data-picked='true'] {
        background: var(--pick);
      }
      .sq[data-target='true']::after {
        content: '';
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(43, 106, 63, 0.55);
        position: absolute;
      }
      .sq {
        position: relative;
      }
      .piece {
        display: block;
      }
      .piece[data-owner='ai'] {
        transform: rotate(180deg);
      }
      .piece[data-check='true'] {
        color: var(--danger);
      }
      /* --- hands --- */
      .hand {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        min-height: 46px;
        padding: 4px 0;
      }
      .hand-label {
        color: var(--muted);
        font-size: 0.85em;
        min-width: 5.5em;
      }
      .hand-piece {
        font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        font-size: 22px;
        line-height: 1;
        padding: 5px 7px;
        border: 1px solid var(--board-line);
        border-radius: 4px;
        background: var(--board);
        color: #1a1207;
        cursor: default;
      }
      .hand-piece[data-clickable='true'] {
        cursor: pointer;
      }
      .hand-piece[data-picked='true'] {
        background: var(--pick);
      }
      .hand-piece sub {
        font-family: system-ui, sans-serif;
        font-size: 11px;
      }
      /* --- side panels --- */
      .side {
        width: 340px;
        display: grid;
        gap: 14px;
      }
      .status {
        font-weight: 600;
        margin: 0;
        min-height: 1.7em;
      }
      .status[data-check='true'] {
        color: var(--danger);
      }
      .meta {
        color: var(--muted);
        font-size: 0.82em;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .meta b {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      button.action {
        font: inherit;
        font-size: 0.9em;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
      }
      button.action:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.primary {
        font: inherit;
        font-weight: 600;
        padding: 6px 16px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      /* --- chat --- */
      .chat-log {
        height: 300px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
      }
      .msg {
        max-width: 88%;
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 0.9em;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg[data-actor='human'] {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
      }
      .msg[data-actor='ai'] {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .msg small {
        display: block;
        opacity: 0.75;
        font-size: 0.78em;
      }
      .chat-form {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .chat-form textarea {
        flex: 1;
        font: inherit;
        font-size: 0.9em;
        resize: vertical;
        min-height: 46px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      .waiting {
        color: var(--muted);
        font-size: 0.85em;
        font-style: italic;
      }
      .kifu {
        height: 150px;
        overflow-y: auto;
        margin: 0;
        font-size: 0.85em;
        line-height: 1.6;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      /* --- promotion dialog --- */
      .promo-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .promo {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 22px;
        text-align: center;
      }
      .promo p {
        margin: 0 0 12px;
        font-weight: 600;
      }
      .live-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #999;
      }
      .live-dot[data-connected='true'] {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <section class="panel">
        <h1>将棋 &mdash; あなた（先手 ▲） vs AI（後手 △）</h1>
        <p class="sub">
          駒をクリックで選択 &rarr; 移動先をクリックで着手。同じ駒をもう一度クリックで取消。
          持ち駒はクリックして打つ場所を選ぶ。
        </p>
        <div class="hand">
          <span class="hand-label">AI の持駒</span>
          <span id="hand-ai"></span>
        </div>
        <div class="board" id="board" role="grid" aria-label="将棋盤"></div>
        <div class="hand">
          <span class="hand-label">あなたの持駒</span>
          <span id="hand-human"></span>
        </div>
      </section>

      <div class="side">
        <section class="panel">
          <p class="status" id="status" role="status" aria-live="polite">接続中...</p>
          <div class="meta">
            <span><span class="live-dot" id="live" data-connected="false"></span> live</span>
            <span>rev <b id="revision">-</b></span>
            <span><b id="move-number">0</b> 手目</span>
          </div>
          <div class="controls">
            <button class="action" type="button" id="undo">待った</button>
            <button class="action" type="button" id="resign">投了</button>
            <button class="action" type="button" id="reset">初手から</button>
          </div>
        </section>

        <section class="panel">
          <strong>AI とのチャット</strong>
          <div class="chat-log" id="chat-log"></div>
          <p class="waiting" id="chat-waiting"></p>
          <div class="chat-form">
            <textarea
              id="chat-input"
              placeholder="ごめん待った！ / なんでそう指したの？ / あと何手で詰む？"
              aria-label="AI へのメッセージ"
            ></textarea>
            <button class="primary" type="button" id="chat-send">送信</button>
          </div>
        </section>

        <section class="panel">
          <strong>棋譜</strong>
          <pre class="kifu" id="kifu"></pre>
        </section>
      </div>
    </div>

    <script type="module">
      const GLYPH = {
        K: ['玉', '玉'],
        R: ['飛', '龍'],
        B: ['角', '馬'],
        G: ['金', '金'],
        S: ['銀', '全'],
        N: ['桂', '圭'],
        L: ['香', '杏'],
        P: ['歩', 'と'],
      };
      const HAND_KINDS = ['R', 'B', 'G', 'S', 'N', 'L', 'P'];
      const RANK_KANJI = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];

      const boardEl = document.getElementById('board');
      const handAiEl = document.getElementById('hand-ai');
      const handHumanEl = document.getElementById('hand-human');
      const statusEl = document.getElementById('status');
      const revisionEl = document.getElementById('revision');
      const moveNumberEl = document.getElementById('move-number');
      const liveEl = document.getElementById('live');
      const kifuEl = document.getElementById('kifu');
      const chatLogEl = document.getElementById('chat-log');
      const chatInputEl = document.getElementById('chat-input');
      const chatSendEl = document.getElementById('chat-send');
      const chatWaitingEl = document.getElementById('chat-waiting');

      /** Latest document from the server. */
      let state = null;
      /** Currently picked board square, or null. */
      let pickedSquare = null;
      /** Currently picked hand piece kind, or null. */
      let pickedDrop = null;

      const squares = [];
      for (let index = 0; index < 81; index += 1) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'sq';
        cell.dataset.index = String(index);
        cell.addEventListener('click', () => onSquareClick(index));
        boardEl.appendChild(cell);
        squares.push(cell);
      }

      /**
       * Square name such as "7六", used for labels.
       *
       * @param {number} index - Square index 0..80.
       * @returns {string} The name.
       */
      function squareName(index) {
        return `${9 - (index % 9)}${RANK_KANJI[Math.floor(index / 9)]}`;
      }

      /**
       * The legal moves currently available to the human from the picked source.
       *
       * @returns {object[]} Matching moves.
       */
      function movesFromPick() {
        if (state === null || state.turn !== 'human') {
          return [];
        }
        if (pickedDrop !== null) {
          return state.legalMoves.filter((move) => move.drop === pickedDrop);
        }
        if (pickedSquare !== null) {
          return state.legalMoves.filter((move) => move.from === pickedSquare);
        }
        return [];
      }

      /**
       * Handle a click on a board square: pick a piece, cancel the pick, or commit a
       * move to that destination.
       *
       * @param {number} index - The clicked square.
       */
      async function onSquareClick(index) {
        if (state === null || state.turn !== 'human') {
          return;
        }
        const candidates = movesFromPick().filter((move) => move.to === index);
        if (candidates.length > 0) {
          const promoting = candidates.filter((move) => move.promote === true);
          const plain = candidates.filter((move) => move.promote !== true);
          if (promoting.length > 0 && plain.length > 0) {
            const promote = await askPromotion();
            if (promote === null) {
              return;
            }
            await send(promote ? promoting[0] : plain[0]);
            return;
          }
          await send(candidates[0]);
          return;
        }
        const piece = state.board[index];
        if (pickedSquare === index) {
          pickedSquare = null;
          render(state);
          return;
        }
        if (piece !== null && piece.owner === 'human') {
          pickedSquare = index;
          pickedDrop = null;
          render(state);
          return;
        }
        pickedSquare = null;
        pickedDrop = null;
        render(state);
      }

      /**
       * Ask whether to promote.
       *
       * @returns {Promise<boolean|null>} True to promote, false to decline, null to abort.
       */
      function askPromotion() {
        return new Promise((resolve) => {
          const backdrop = document.createElement('div');
          backdrop.className = 'promo-backdrop';
          const box = document.createElement('div');
          box.className = 'promo';
          const label = document.createElement('p');
          label.textContent = '成りますか？';
          const yes = document.createElement('button');
          yes.className = 'primary';
          yes.textContent = '成る';
          const no = document.createElement('button');
          no.className = 'action';
          no.textContent = '不成';
          no.style.marginLeft = '8px';
          const finish = (value) => {
            backdrop.remove();
            resolve(value);
          };
          yes.addEventListener('click', () => finish(true));
          no.addEventListener('click', () => finish(false));
          backdrop.addEventListener('click', (event) => {
            if (event.target === backdrop) {
              finish(null);
            }
          });
          box.append(label, yes, no);
          backdrop.appendChild(box);
          document.body.appendChild(backdrop);
          yes.focus();
        });
      }

      /**
       * Commit a move, quoting the revision this page is showing so the server can
       * reject a write that raced with the AI.
       *
       * @param {object} move - A legal move from the document.
       */
      async function send(move) {
        const command =
          move.drop !== undefined
            ? { type: 'drop', kind: move.drop, to: move.to }
            : { type: 'move', from: move.from, to: move.to, promote: move.promote === true };
        pickedSquare = null;
        pickedDrop = null;
        await post('/api/apply', { actor: 'human', baseRevision: state.revision, commands: [command] });
      }

      /**
       * POST a payload and render whatever document comes back.
       *
       * @param {string} path - API path.
       * @param {object} payload - Request body.
       * @returns {Promise<boolean>} True on success.
       */
      async function post(path, payload) {
        const response = await fetch(path, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const body = await response.json();
        if (!response.ok) {
          statusEl.textContent = `拒否: ${body.error}`;
          if (body.state !== undefined) {
            render(body.state);
          }
          return false;
        }
        render(body);
        return true;
      }

      document.getElementById('undo').addEventListener('click', async () => {
        // Take back the AI's reply and our own move together; fall back to one ply
        // when there is only one position on the stack.
        const ok = await post('/api/apply', { actor: 'human', commands: [{ type: 'undo', count: 2 }] });
        if (!ok) {
          await post('/api/apply', { actor: 'human', commands: [{ type: 'undo', count: 1 }] });
        }
      });
      document.getElementById('resign').addEventListener('click', async () => {
        await post('/api/apply', { actor: 'human', commands: [{ type: 'resign' }] });
      });
      document.getElementById('reset').addEventListener('click', async () => {
        await post('/api/apply', { actor: 'human', commands: [{ type: 'reset' }] });
      });

      chatSendEl.addEventListener('click', () => void sendChat());
      chatInputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          void sendChat();
        }
      });

      /** Post the chat box contents. */
      async function sendChat() {
        const text = chatInputEl.value.trim();
        if (text === '') {
          return;
        }
        chatInputEl.value = '';
        await post('/api/chat', { actor: 'human', text });
      }

      /**
       * Paint the whole document: board, hands, status, kifu and chat.
       *
       * @param {object} next - The document.
       */
      function render(next) {
        state = next;
        if (next.turn !== 'human') {
          pickedSquare = null;
          pickedDrop = null;
        }
        const targets = new Set(movesFromPick().map((move) => move.to));
        const lastTo = next.lastMove === null ? -1 : next.lastMove.to;

        for (let index = 0; index < 81; index += 1) {
          const cell = squares[index];
          const piece = next.board[index];
          cell.textContent = '';
          if (piece !== null) {
            const glyph = document.createElement('span');
            glyph.className = 'piece';
            glyph.dataset.owner = piece.owner;
            glyph.textContent = GLYPH[piece.kind][piece.promoted ? 1 : 0];
            if (piece.kind === 'K' && next.inCheck && piece.owner === next.turn) {
              glyph.dataset.check = 'true';
            }
            cell.appendChild(glyph);
          }
          cell.dataset.last = index === lastTo ? 'true' : 'false';
          cell.dataset.picked = index === pickedSquare ? 'true' : 'false';
          cell.dataset.target = targets.has(index) ? 'true' : 'false';
          const isOwn = piece !== null && piece.owner === 'human';
          cell.dataset.clickable =
            next.turn === 'human' && (isOwn || targets.has(index)) ? 'true' : 'false';
          cell.setAttribute(
            'aria-label',
            `${squareName(index)} ${piece === null ? '空' : GLYPH[piece.kind][piece.promoted ? 1 : 0]}`,
          );
        }

        renderHand(handHumanEl, next.hands.human, 'human', next);
        renderHand(handAiEl, next.hands.ai, 'ai', next);

        revisionEl.textContent = String(next.revision);
        moveNumberEl.textContent = String(next.moveNumber);
        statusEl.dataset.check = next.inCheck ? 'true' : 'false';
        if (next.winner !== null) {
          const who = next.winner === 'human' ? 'あなたの勝ち' : 'AI の勝ち';
          const reason =
            next.endReason === 'checkmate'
              ? '詰み'
              : next.endReason === 'resign'
                ? '投了'
                : '手詰まり';
          statusEl.textContent = `${reason} — ${who}`;
        } else if (next.turn === 'human') {
          statusEl.textContent = next.inCheck ? 'あなたの手番（王手されています）' : 'あなたの手番';
        } else {
          statusEl.textContent = next.inCheck ? 'AI 考慮中（AI に王手）' : 'AI 考慮中...';
        }

        kifuEl.textContent = next.kifu.join('\n');
        kifuEl.scrollTop = kifuEl.scrollHeight;
        renderChat(next.chat);
        const lastMessage = next.chat[next.chat.length - 1];
        chatWaitingEl.textContent =
          lastMessage !== undefined && lastMessage.actor === 'human'
            ? 'AI の返事を待っています...'
            : '';
      }

      /**
       * Paint one side's hand.
       *
       * @param {HTMLElement} host - Where to paint.
       * @param {object} hand - Counts by kind.
       * @param {string} owner - Whose hand.
       * @param {object} next - The document.
       */
      function renderHand(host, hand, owner, next) {
        host.textContent = '';
        const kinds = HAND_KINDS.filter((kind) => hand[kind] > 0);
        if (kinds.length === 0) {
          const none = document.createElement('span');
          none.className = 'waiting';
          none.textContent = 'なし';
          host.appendChild(none);
          return;
        }
        for (const kind of kinds) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'hand-piece';
          chip.textContent = GLYPH[kind][0];
          if (hand[kind] > 1) {
            const count = document.createElement('sub');
            count.textContent = String(hand[kind]);
            chip.appendChild(count);
          }
          const usable = owner === 'human' && next.turn === 'human';
          chip.dataset.clickable = usable ? 'true' : 'false';
          chip.dataset.picked = owner === 'human' && pickedDrop === kind ? 'true' : 'false';
          chip.disabled = !usable;
          chip.addEventListener('click', () => {
            pickedDrop = pickedDrop === kind ? null : kind;
            pickedSquare = null;
            render(state);
          });
          host.appendChild(chip);
        }
      }

      /**
       * Paint the chat log, keeping it scrolled to the newest message.
       *
       * @param {object[]} messages - Chat entries.
       */
      function renderChat(messages) {
        chatLogEl.textContent = '';
        for (const message of messages) {
          const bubble = document.createElement('div');
          bubble.className = 'msg';
          bubble.dataset.actor = message.actor;
          bubble.textContent = message.text;
          const meta = document.createElement('small');
          meta.textContent = `${message.actor === 'human' ? 'あなた' : 'AI'} · ${message.atMove}手目`;
          bubble.appendChild(meta);
          chatLogEl.appendChild(bubble);
        }
        chatLogEl.scrollTop = chatLogEl.scrollHeight;
      }

      const events = new EventSource('/api/events');
      events.addEventListener('open', () => {
        liveEl.dataset.connected = 'true';
      });
      events.addEventListener('error', () => {
        liveEl.dataset.connected = 'false';
      });
      events.addEventListener('change', (event) => {
        render(JSON.parse(event.data));
      });
    </script>
  </body>
</html>
