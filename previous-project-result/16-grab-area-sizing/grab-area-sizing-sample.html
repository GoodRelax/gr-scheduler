<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>掴み代を触って決める</title>
<style>
  :root { --ink:#16181d; --ink2:#55606f; --rule:#d7dde7; --ground:#fdfdfd;
          --plan:#bcd8f5; --plan-edge:#3b6fb5; --actual:#4a8fe0; --actual-edge:#2d5f9e;
          --ms:#f0b429; --ms-edge:#946200; --dummy:#8e44ad; --dummy-edge:#5b2c6f;
          --arrow-plan:#7aa9de; --arrow-actual:#10366b; --ms-actual:#8a5a00; }
  body { margin: 12px; background: #fff; color: var(--ink); font-size: 13px;
         font-family: "Yu Gothic UI", "Yu Gothic", YuGothic, "BIZ UDPGothic", sans-serif; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  p.note { color: var(--ink2); margin: 0 0 10px; }
  .wrap { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .panel { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; min-width: 268px; }
  .panel h2 { font-size: 13px; margin: 8px 0 4px; }
  .panel h2:first-child { margin-top: 0; }
  label { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  label span.name { width: 152px; }
  label input[type=range] { width: 104px; }
  label output { width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  svg { border: 1px solid var(--rule); background: var(--ground); touch-action: none; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 0; color: var(--ink2); }
  .legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid #555; margin-right: 4px; vertical-align: -2px; }
  #hit { font-weight: 600; min-height: 18px; margin-top: 4px; }
  #summary { margin-top: 6px; padding: 6px 8px; background: #f4f6f9; border-radius: 4px; white-space: pre-wrap; font-size: 12px; }
  .cursorRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .cursorCell { border: 1px solid var(--rule); padding: 3px 6px; border-radius: 4px; text-align: center; font-size: 11px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  button { font: inherit; padding: 2px 8px; }
</style>
</head>
<body>
<h1>掴み代を触って決める</h1>
<p class="note">
  <b>触れます。</b>バーの本体を引けば横に動き、端を引けば伸び縮みします。マイルストーンもフェードの □ も引けます。
  <b>マーカーは、押せば状態が巡り（未着手 → 50% → 100% → 未着手）、引けば実績の終わりが動きます。</b>
  色の面がその掴み代で、<b>横</b>と<b>縦</b>の広がりをそのまま描いています。つまみで大きさを変えると、絵も当たり判定もその場で変わります。
  最後の行に今の値がまとまります。
</p>

<div class="wrap">
  <div>
    <svg id="stage" width="900" height="420" viewBox="0 0 900 420"></svg>
    <div class="legend">
      <span><i style="background:rgba(30,110,220,.28)"></i>予定の端</span>
      <span><i style="background:rgba(220,120,0,.30)"></i>実績の端</span>
      <span><i style="background:rgba(0,150,90,.30)"></i>マーカー</span>
      <span><i style="background:rgba(200,30,60,.30)"></i>フェード</span>
      <span><i style="background:rgba(120,120,120,.22)"></i>本体（動かす）</span>
    </div>
    <div id="hit">&nbsp;</div>
    <div id="summary"></div>
  </div>

  <div class="panel">
    <h2>絵の大きさ</h2>
    <label><span class="name">全体のズーム（%）</span><input id="scale" type="range" min="50" max="200" step="5" value="100"><output id="scaleOut"></output></label>
    <label><span class="name">1 日の幅（px）</span><input id="dayPx" type="range" min="2" max="40" step="1" value="12"><output id="dayPxOut"></output></label>
    <label><span class="name">予定バーの高さ（px）</span><input id="barH" type="range" min="8" max="40" step="1" value="18"><output id="barHOut"></output></label>

    <h2>掴み代</h2>
    <label><span class="name">予定の端 横（外側）</span><input id="s90" type="range" min="0" max="24" step="1" value="12"><output id="s90Out"></output></label>
    <label><span class="name">予定の端 縦（外へ上下）</span><input id="planV" type="range" min="0" max="20" step="1" value="0"><output id="planVOut"></output></label>
    <label><span class="name">実績の端 横（内側）</span><input id="s91" type="range" min="0" max="24" step="1" value="12"><output id="s91Out"></output></label>
    <label><span class="name">実績の端 縦（外へ上下）</span><input id="actualV" type="range" min="0" max="20" step="1" value="0"><output id="actualVOut"></output></label>
    <label><span class="name">マーカー 一辺</span><input id="markerGrab" type="range" min="6" max="32" step="1" value="14"><output id="markerGrabOut"></output></label>
    <label><span class="name">フェード 一辺</span><input id="s92" type="range" min="4" max="20" step="1" value="8"><output id="s92Out"></output></label>
    <label><span class="name">マイルストーン 外側</span><input id="msGrab" type="range" min="0" max="24" step="1" value="12"><output id="msGrabOut"></output></label>
    <label><span class="name">縦の下限（共通、px）</span><input id="vMin" type="range" min="0" max="40" step="1" value="0"><output id="vMinOut"></output></label>

    <h2>札（名前・進捗・担当）</h2>
    <label><span class="name">実績と札の間隔（px）</span><input id="labelGap" type="range" min="0" max="24" step="1" value="4"><output id="labelGapOut"></output></label>
    <label><span class="name">札の字の大きさ（× 実績の高さ）</span><input id="labelFont" type="range" min="50" max="130" step="5" value="90"><output id="labelFontOut"></output></label>

    <h2>ポインタの矢印</h2>
    <label><span class="name">一辺（px）</span><input id="cur" type="range" min="8" max="32" step="1" value="16"><output id="curOut"></output></label>
    <div class="cursorRow" id="cursorSizes"></div>

    <h2>表示</h2>
    <div class="row">
      <label style="margin:0"><input id="showZones" type="checkbox" checked> 掴み代の面</label>
      <label style="margin:0"><input id="showMarker" type="checkbox" checked> 進捗マーカー</label>
      <label style="margin:0"><input id="showName" type="checkbox" checked> タスク名</label>
      <label style="margin:0"><input id="showPercent" type="checkbox" checked> 進捗 ％</label>
      <label style="margin:0"><input id="showAssignee" type="checkbox" checked> 担当者</label>
      <label style="margin:0"><input id="msActual" type="checkbox" checked> マイルストーンの実績</label>
      <button id="reset" type="button">形を元に戻す</button>
    </div>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

const S = { scale:100, dayPx:12, barH:18, s90:12, planV:0, s91:12, actualV:0,
            markerGrab:14, s92:8, msGrab:12, vMin:0, labelGap:4, labelFont:90, cur:16 };
const SLIDERS = Object.keys(S);

const START = {
  task:  { planStart: 2, planDays: 20, actualStart: 2, actualDays: 12, fadeIn: 0, fadeOut: 0,
           name: '要件定義レビュー', percent: 60, assignee: '設計担当' },
  unset: { planStart: 4, planDays: 16, name: '結合試験', percent: 0, assignee: '試験担当' },
  arrow: { planStart: 6, planDays: 14, actualStart: 6, actualDays: 8, name: '設計レビュー', percent: 40, assignee: '設計担当' },
  ms:    { day: 26, actualDay: 24, name: 'リリース判定', percent: 0, assignee: '品質担当' },
};
let M = JSON.parse(JSON.stringify(START));

const LEFT = 120, TOP = { task: 52, unset: 150, arrow: 236, ms: 316 }, RULER = 386;

function ratio() { return S.scale / 100; }
function dayPx() { return S.dayPx * ratio(); }
function barH() { return S.barH * ratio(); }
function actualH() { return Math.max(4, barH() * 0.5715); }
function markerPx() { return S.markerGrab * ratio(); }
function dummyPx() { return Math.min(markerPx() * 0.5, 30 * ratio()); }
function xOf(day) { return LEFT + day * dayPx(); }
function dayAt(x) { return (x - LEFT) / dayPx(); }

function arrowCursor(dir, filled, px) {
  const fill = filled ? '#000000' : '#ffffff';
  const line = filled ? '#ffffff' : '#000000';
  const flip = dir === 'right' ? ' transform="scale(-1,1) translate(-24,0)"' : '';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="0 0 24 24">' +
    '<g' + flip + '><path d="M10 4 L2 12 L10 20 L10 15 L20 15 L20 9 L10 9 Z" fill="' + fill +
    '" stroke="' + line + '" stroke-width="1.6" stroke-linejoin="round"/></g></svg>';
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '") ' + Math.round(px / 2) + ' ' + Math.round(px / 2) + ', ew-resize';
}

function el(parent, name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
}
function rect(parent, x, y, w, h, fill, stroke, dash) {
  return el(parent, 'rect', { x, y, width: Math.max(0, w), height: Math.max(0, h), fill,
    stroke: stroke || 'none', 'stroke-width': stroke ? 1 : 0, 'stroke-dasharray': dash || 'none' });
}
function label(parent, x, y, s, size, anchor) {
  const t = el(parent, 'text', { x, y, 'font-size': size || 11, fill: '#333', 'text-anchor': anchor || 'start' });
  t.textContent = s;
  return t;
}

let zones = [];
function zone(g, id, kind, x, y, w, h, fill, cursor) {
  if ($('showZones').checked) rect(g, x, y, w, h, fill, '#555', '2 2');
  zones.push({ id, kind, x, y, w: Math.max(0, w), h: Math.max(0, h), cursor });
}
// the vertical reach of a grab area: the band, plus `out` above and below, at least S.vMin tall
function band(top, height, out) {
  const h = Math.max(height + (out || 0) * 2, S.vMin);
  return { y: top + height / 2 - h / 2, h };
}
// OC-1: the name label follows the shapes. Where it starts is the rule under test:
//   it fits inside the bar  -> marker and name start at the bar's START, inside
//   it does not fit         -> marker and name start at the bar's END, outside
function measureName(g, name) {
  const size = Math.max(6, actualH() * (S.labelFont / 100));
  const t = el(g, 'text', { x: -9999, y: -9999, 'font-size': size });
  t.textContent = name;
  const w = t.getBBox().width;
  g.removeChild(t);
  return w;
}
// answers where the marker goes and where the name goes for one bar
function placeAlong(g, item, barX, barW, marked, mk) {
  const showName = $('showName').checked && item.name;
  const nameW = showName ? measureName(g, item.name) : 0;
  const fits = showName ? nameW <= barW : true;
  // the marker always stands right of the finish; the name goes inside from the start when it fits,
  // otherwise it follows the marker outside
  const markerX = barX + barW;
  const nameX = fits ? barX : markerX + (marked ? mk + S.labelGap : 0);
  return { fits, markerX, nameX, nameW };
}
function drawName(g, item, x, centerY) {
  if ($('showName').checked && item.name) labelRow(g, x, centerY, [{ text: item.name, bold: true }]);
}
// OC-2: assignee and percent are ONE label, left of the plan bar, right-aligned (FR-090, OR-1)
function drawOutsideLabel(g, item, rightX, centerY) {
  const bits = [];
  if ($('showAssignee').checked && item.assignee) bits.push(item.assignee);
  if ($('showPercent').checked && typeof item.percent === 'number') bits.push(item.percent + '%');
  if (!bits.length) return;
  const size = Math.max(6, actualH() * (S.labelFont / 100));
  const t = el(g, 'text', { x: rightX, y: centerY + size * 0.36, 'font-size': size, fill: '#16181d',
    'text-anchor': 'end', 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': size * 0.1 });
  t.textContent = bits.join(' ');
}
function labelRow(g, x, centerY, parts) {
  const size = Math.max(6, actualH() * (S.labelFont / 100));
  let at = x;
  for (const part of parts) {
    const t = el(g, 'text', { x: at, y: centerY + size * 0.36, 'font-size': size, fill: '#16181d',
      'font-weight': part.bold ? 600 : 400, 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': size * 0.1 });
    t.textContent = part.text;
    at += t.getBBox().width + S.labelGap;
  }
  return at;
}

function draw() {
  const g = $('stage');
  while (g.firstChild) g.removeChild(g.firstChild);
  zones = [];
  const day = dayPx(), bh = barH(), ah = actualH(), mk = markerPx(), dw = dummyPx();

  // day grid
  for (let d = 0; d <= 60; d++) {
    const x = xOf(d);
    if (x > 890) break;
    el(g, 'line', { x1: x, y1: 30, x2: x, y2: 378, stroke: d % 7 === 0 ? '#c9d3e0' : '#eef1f6', 'stroke-width': 1 });
  }

  // ---- 1) a task with plan, actual, marker and fades
  const t = M.task, ty = TOP.task;
  const planX = xOf(t.planStart), planW = t.planDays * day;
  const actX = xOf(t.actualStart), actW = t.actualDays * day, actY = ty + (bh - ah) / 2;
  label(g, 8, ty + bh / 2 + 4, '① 予実のあるタスク', 12);
  const planBand = band(ty, bh, S.planV), actBand = band(actY, ah, S.actualV);
  zone(g, 'task-plan-start', 'planEnd', planX - S.s90, planBand.y, S.s90, planBand.h, 'rgba(30,110,220,.28)', arrowCursor('left', false, S.cur));
  zone(g, 'task-plan-end', 'planEnd', planX + planW, planBand.y, S.s90, planBand.h, 'rgba(30,110,220,.28)', arrowCursor('right', false, S.cur));
  zone(g, 'task-body', 'body', planX, ty, planW, bh, 'rgba(120,120,120,.22)', 'grab');
  if (t.actualDays > 0) {
    zone(g, 'task-actual-start', 'actualEnd', actX, actBand.y, S.s91, actBand.h, 'rgba(220,120,0,.30)', arrowCursor('left', true, S.cur));
    zone(g, 'task-actual-end', 'actualEnd', actX + actW - S.s91, actBand.y, S.s91, actBand.h, 'rgba(220,120,0,.30)', arrowCursor('right', true, S.cur));
  }
  const fadeInX = planX + Math.min(t.fadeIn * day, planW);          // T-012a point 4, it moves with the fade
  const fadeOutX = planX + planW - Math.min(t.fadeOut * day, planW); // T-012a point 2
  zone(g, 'task-fade-in', 'fade', fadeInX - S.s92 / 2, ty - S.s92 / 2, S.s92, S.s92, 'rgba(200,30,60,.30)', 'nwse-resize');
  zone(g, 'task-fade-out', 'fade', fadeOutX - S.s92 / 2, ty + bh - S.s92 / 2, S.s92, S.s92, 'rgba(200,30,60,.30)', 'nwse-resize');
  const marked = $('showMarker').checked;
  const alongX = t.actualDays > 0 ? actX : planX, alongW = t.actualDays > 0 ? actW : planW;
  const put = placeAlong(g, t, alongX, alongW, marked, mk);
  const mkX = put.markerX;
  if (marked) zone(g, 'task-marker', 'marker', mkX, ty + (bh - mk) / 2, mk, mk, 'rgba(0,150,90,.30)', 'pointer');

  // fades draw as a lighter wedge inside the plan bar
  // the bar itself is the trapezoid: point 4 slides right with the fade in, point 2 slides left with the fade out
  el(g, 'path', { d: 'M ' + fadeInX + ' ' + ty + ' L ' + (planX + planW) + ' ' + ty +
                     ' L ' + fadeOutX + ' ' + (ty + bh) + ' L ' + planX + ' ' + (ty + bh) + ' Z',
                  fill: 'var(--plan)', stroke: 'var(--plan-edge)', 'stroke-width': 1 });
  if (t.actualDays > 0) rect(g, actX, actY, actW, ah, 'var(--actual)', 'var(--actual-edge)');
  if (marked) el(g, 'circle', { cx: mkX + mk / 2, cy: ty + bh / 2, r: Math.max(2, mk / 2 - 1), fill: '#fff', stroke: '#0a7a48', 'stroke-width': 1.5 });
  rect(g, fadeInX - 2.5, ty - 2.5, 5, 5, '#fff', '#c0203c');
  rect(g, fadeOutX - 2.5, ty + bh - 2.5, 5, 5, '#fff', '#c0203c');
  // the name starts where the rule says: inside from the start when it fits, else outside from the end
  drawName(g, t, put.nameX, ty + bh / 2);
  drawOutsideLabel(g, t, planX - S.labelGap, ty + bh / 2);
  label(g, LEFT, ty - 10, '予定 ' + t.planDays + ' 日（' + t.planStart + ' 日目から） / 実績 ' + t.actualDays + ' 日 / フェード 入 ' + t.fadeIn + ' 日・出 ' + t.fadeOut + ' 日 ・ 札は' + (put.fits ? '中（開始から）' : '外（終了から）'), 11);

  // ---- 2) an unstarted task with the dummy
  const u = M.unset, uy = TOP.unset;
  const uX = xOf(u.planStart), uW = u.planDays * day;
  label(g, 8, uy + bh / 2 + 4, '② 未着手（ダミー）', 12);
  const uBand = band(uy, bh, S.planV), dBand = band(uy + (bh - mk) / 2, mk, S.actualV);
  zone(g, 'unset-plan-start', 'planEnd', uX - S.s90, uBand.y, S.s90, uBand.h, 'rgba(30,110,220,.28)', arrowCursor('left', false, S.cur));
  zone(g, 'unset-plan-end', 'planEnd', uX + uW, uBand.y, S.s90, uBand.h, 'rgba(30,110,220,.28)', arrowCursor('right', false, S.cur));
  zone(g, 'unset-body', 'body', uX, uy, uW, bh, 'rgba(120,120,120,.22)', 'grab');
  zone(g, 'unset-dummy-start', 'dummy', uX - S.s91, dBand.y, S.s91 + dw / 2, dBand.h, 'rgba(220,120,0,.30)', arrowCursor('left', true, S.cur));
  zone(g, 'unset-dummy-end', 'dummy', uX + dw / 2, dBand.y, S.s91 + dw / 2, dBand.h, 'rgba(220,120,0,.30)', arrowCursor('right', true, S.cur));
  const putU = placeAlong(g, u, uX, uW, marked, mk);
  const uMkX = putU.markerX;
  if (marked) zone(g, 'unset-marker', 'marker', uMkX, uy + (bh - mk) / 2, mk, mk, 'rgba(0,150,90,.30)', 'pointer');
  rect(g, uX, uy, uW, bh, 'var(--plan)', 'var(--plan-edge)');
  if (u.actualDays > 0) {
    rect(g, xOf(u.actualStart), uy + (bh - actualH()) / 2, u.actualDays * day, actualH(), 'var(--actual)', 'var(--actual-edge)');
  } else {
    rect(g, uX, uy + (bh - mk) / 2, dw, mk, 'var(--dummy)', 'var(--dummy-edge)');
  }
  if (marked) el(g, 'circle', { cx: uMkX + mk / 2, cy: uy + bh / 2, r: Math.max(2, mk / 2 - 1), fill: '#fff', stroke: '#0a7a48', 'stroke-width': 1.5 });
  drawName(g, u, putU.nameX, uy + bh / 2);
  drawOutsideLabel(g, u, uX - S.labelGap, uy + bh / 2);
  label(g, LEFT, uy - 10, 'ダミー（掴み代は実績と同じ）の描く幅 = マーカー径 × 0.5 = ' + dw.toFixed(2) + 'px（押せるのは片側 ' + (S.s91 + dw / 2).toFixed(2) + 'px）', 11);

  // ---- 3) a milestone: a plan diamond, an actual diamond (or the unstarted dummy)
  const msY = TOP.ms, msR = bh / 2;
  const msX = xOf(M.ms.day), msActX = xOf(M.ms.actualDay);
  const hasMsActual = $('msActual').checked;
  label(g, 8, msY + bh / 2 + 4, '3 マイルストーン', 12);
  const msBand = band(msY, bh, S.planV);
  zone(g, 'ms', 'ms', msX - msR - S.msGrab, msBand.y, (msR + S.msGrab) * 2, msBand.h, 'rgba(30,110,220,.20)', 'grab');
  if (hasMsActual) {
    const msActBand = band(msY + bh * 0.15, bh * 0.7, S.actualV);
    zone(g, 'ms-actual', 'actualEnd', msActX - msR * 0.7 - S.s91, msActBand.y, (msR * 0.7 + S.s91) * 2, msActBand.h, 'rgba(220,120,0,.30)', 'grab');
  } else {
    const dBand2 = band(msY + (bh - mk) / 2, mk, S.actualV);
    zone(g, 'ms-dummy', 'dummy', msX - dw / 2 - S.s91, dBand2.y, dw + S.s91 * 2, dBand2.h, 'rgba(220,120,0,.30)', arrowCursor('right', true, S.cur));
  }
  el(g, 'path', { d: 'M ' + msX + ' ' + msY + ' L ' + (msX + msR) + ' ' + (msY + msR) + ' L ' + msX + ' ' + (msY + bh) +
                     ' L ' + (msX - msR) + ' ' + (msY + msR) + ' Z', fill: 'var(--ms)', stroke: 'var(--ms-edge)', 'stroke-width': 1 });
  if (hasMsActual) {
    const r2 = msR * 0.7;
    el(g, 'path', { d: 'M ' + msActX + ' ' + (msY + msR - r2) + ' L ' + (msActX + r2) + ' ' + (msY + msR) +
                       ' L ' + msActX + ' ' + (msY + msR + r2) + ' L ' + (msActX - r2) + ' ' + (msY + msR) + ' Z',
                    fill: 'var(--ms-actual)', stroke: 'none' });
  } else {
    rect(g, msX - dw / 2, msY + (bh - mk) / 2, dw, mk, 'var(--dummy)', 'var(--dummy-edge)');
  }
  // the labels follow the ACTUAL (or the dummy when the milestone is unstarted), never the plan
  const msFollowX = hasMsActual ? msActX : msX;
  // the name starts a quarter of a glyph right of that centre, so short names still sit inside the shape
  const msHalf = hasMsActual ? msR * 0.7 : dw / 2;
  // the marker stands OUTSIDE the shape, so it never covers what the shape itself must answer
  const msAnchor = msFollowX + msHalf;
  if (marked) {
    zone(g, 'ms-marker', 'marker', msAnchor, msY + (bh - mk) / 2, mk, mk, 'rgba(0,150,90,.30)', 'pointer');
    el(g, 'circle', { cx: msAnchor + mk / 2, cy: msY + bh / 2, r: Math.max(2, mk / 2 - 1), fill: '#fff', stroke: '#0a7a48', 'stroke-width': 1.5 });
  }
  // with a marker the name follows it; without one it starts a quarter of a glyph right of the centre
  drawName(g, M.ms, marked ? msAnchor + mk + S.labelGap : msFollowX + bh * 0.25, msY + bh / 2);
  drawOutsideLabel(g, M.ms, msFollowX - bh * 0.25 - S.labelGap, msY + bh / 2);
  label(g, LEFT, msY - 10, '予定 ' + M.ms.day + ' 日目' + (hasMsActual ? ' / 実績 ' + M.ms.actualDay + ' 日目' : ' / 未着手（ダミー）'), 11);

  // ---- 4) an arrow task (SH-3 `--->`): no outline, the actual sits close under the plan,
  //          and the name stands ABOVE the plan, aligned with the actual when one is drawn
  const a = M.arrow, ay = TOP.arrow;
  const aX = xOf(a.planStart), aW = a.planDays * day, head = Math.min(bh * 0.8, aW);
  const aActX = xOf(a.actualStart), aActW = a.actualDays * day;
  const planY = ay + bh * 0.42, actY2 = ay + bh * 0.72, shaft = Math.max(2, bh * 0.16);
  const headH = shaft * 3.2;   // the arrow head's full height: the grab band matches the drawn shape
  label(g, 8, ay + bh / 2 + 4, '4 矢印（--->）', 12);
  // the two bands are split at the midline between the plan and the actual, so they never overlap
  const splitY = (planY + actY2) / 2;
  const cut = (b, top, bottom) => {
    const y = Math.max(b.y, top), h = Math.min(b.y + b.h, bottom) - y;
    return { y, h: Math.max(0, h) };
  };
  const aBand = cut(band(planY - headH / 2, headH, S.planV), ay, splitY);
  zone(g, 'arrow-plan-start', 'planEnd', aX - S.s90, aBand.y, S.s90, aBand.h, 'rgba(30,110,220,.28)', arrowCursor('left', false, S.cur));
  zone(g, 'arrow-plan-end', 'planEnd', aX + aW, aBand.y, S.s90, aBand.h, 'rgba(30,110,220,.28)', arrowCursor('right', false, S.cur));
  zone(g, 'arrow-body', 'body', aX, aBand.y, aW, aBand.h, 'rgba(120,120,120,.22)', 'grab');
  if (a.actualDays > 0) {
    const abBand = cut(band(actY2 - headH * 0.4, headH * 0.8, S.actualV), splitY, ay + bh);
    // the arrow's actual is held from OUTSIDE its two ends, exactly as its plan is,
    // so the head stays readable and both ends answer at the same place
    zone(g, 'arrow-actual-start', 'actualEnd', aActX - S.s91, abBand.y, S.s91, abBand.h, 'rgba(220,120,0,.30)', arrowCursor('left', true, S.cur));
    zone(g, 'arrow-actual-end', 'actualEnd', aActX + aActW, abBand.y, S.s91, abBand.h, 'rgba(220,120,0,.30)', arrowCursor('right', true, S.cur));
  }
  // drawn with fill only -- no outline (the user's ruling of 2026-09-18)
  el(g, 'path', { d: 'M ' + aX + ' ' + (planY - shaft / 2) + ' L ' + (aX + aW - head) + ' ' + (planY - shaft / 2) +
                     ' L ' + (aX + aW - head) + ' ' + (planY - shaft * 1.6) + ' L ' + (aX + aW) + ' ' + planY +
                     ' L ' + (aX + aW - head) + ' ' + (planY + shaft * 1.6) + ' L ' + (aX + aW - head) + ' ' + (planY + shaft / 2) +
                     ' L ' + aX + ' ' + (planY + shaft / 2) + ' Z', fill: 'var(--arrow-plan)', stroke: 'none' });
  if (a.actualDays > 0) {
    // the actual is an arrow as well, drawn a little thinner and without an outline
    const aHead = Math.min(shaft * 3, aActW), th = shaft * 0.8;
    el(g, 'path', { d: 'M ' + aActX + ' ' + (actY2 - th / 2) + ' L ' + (aActX + aActW - aHead) + ' ' + (actY2 - th / 2) +
                       ' L ' + (aActX + aActW - aHead) + ' ' + (actY2 - th * 1.6) + ' L ' + (aActX + aActW) + ' ' + actY2 +
                       ' L ' + (aActX + aActW - aHead) + ' ' + (actY2 + th * 1.6) + ' L ' + (aActX + aActW - aHead) + ' ' + (actY2 + th / 2) +
                       ' L ' + aActX + ' ' + (actY2 + th / 2) + ' Z', fill: 'var(--arrow-actual)', stroke: 'none' });
  }
  const putA = placeAlong(g, a, a.actualDays > 0 ? aActX : aX, a.actualDays > 0 ? aActW : aW, marked, mk);
  const aMkX = putA.markerX;
  const aLabelY = ay + bh * 0.1;   // above the plan (SH-3 puts the name over plan and actual)
  if (marked) {
    zone(g, 'arrow-marker', 'marker', aMkX, aLabelY - mk / 2, mk, mk, 'rgba(0,150,90,.30)', 'pointer');
    el(g, 'circle', { cx: aMkX + mk / 2, cy: aLabelY, r: Math.max(2, mk / 2 - 1), fill: '#fff', stroke: '#0a7a48', 'stroke-width': 1.5 });
  }
  drawName(g, a, putA.nameX, aLabelY);
  drawOutsideLabel(g, a, aX - S.labelGap, planY);
  label(g, LEFT, ay - 10, '矢印はフェードを持たず、縁取りも描かない。掴み代は形の高さに合わせ、予定と実績は中線で分ける。実績の端も予定と同じく外側', 11);

  // ruler
  rect(g, LEFT, RULER, 10 * day, 6, '#888', '#333');
  label(g, LEFT + 10 * day + 6, RULER + 6, '10 日ぶん = ' + (10 * day).toFixed(1) + 'px', 11);
  summary();
}

function hitAt(x, y) {
  const order = ['fade', 'marker', 'dummy', 'actualEnd', 'planEnd', 'ms', 'body'];
  for (const kind of order) {
    for (let i = zones.length - 1; i >= 0; i--) {
      const z = zones[i];
      if (z.kind !== kind) continue;
      if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return z;
    }
  }
  return null;
}

let drag = null;
const stage = $('stage');
function pointAt(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (900 / r.width), y: (e.clientY - r.top) * (420 / r.height) };
}
stage.addEventListener('pointerdown', e => {
  const p = pointAt(e);
  const z = hitAt(p.x, p.y);
  if (!z) return;
  drag = { id: z.id, startDay: dayAt(p.x), model: JSON.parse(JSON.stringify(M)), moved: 0 };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  const p = pointAt(e);
  if (!drag) {
    const z = hitAt(p.x, p.y);
    $('hit').textContent = z ? ('掴み代: ' + z.id + '（横 ' + z.w.toFixed(1) + 'px / 縦 ' + z.h.toFixed(1) + 'px）') : ' ';
    stage.style.cursor = z ? z.cursor : 'default';
    return;
  }
  const moved = Math.round(dayAt(p.x) - drag.startDay);
  drag.moved = moved;
  const m = JSON.parse(JSON.stringify(drag.model)), t = m.task, u = m.unset;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  switch (drag.id) {
    case 'task-body': t.planStart = clamp(t.planStart + moved, 0, 55); t.actualStart = clamp(t.actualStart + moved, 0, 55); break;
    case 'task-plan-start': { const end = t.planStart + t.planDays; t.planStart = clamp(t.planStart + moved, 0, end - 1); t.planDays = end - t.planStart; break; }
    case 'task-plan-end': t.planDays = clamp(t.planDays + moved, 1, 55 - t.planStart); break;
    case 'task-actual-start': { const end = t.actualStart + t.actualDays; t.actualStart = clamp(t.actualStart + moved, 0, end - 1); t.actualDays = end - t.actualStart; break; }
    case 'task-actual-end': t.actualDays = clamp(t.actualDays + moved, 1, 55 - t.actualStart); break;
    case 'task-fade-in': t.fadeIn = clamp(t.fadeIn + moved, 0, t.planDays); break;
    case 'task-fade-out': t.fadeOut = clamp(t.fadeOut - moved, 0, t.planDays); break;
    case 'task-marker': t.actualDays = clamp(t.actualDays + moved, 1, 55 - t.actualStart); break;
    case 'unset-marker': u.actualDays = clamp((u.actualDays || 0) + moved, 1, 55 - u.planStart); u.actualStart = u.planStart; break;
    case 'arrow-marker': m.arrow.actualDays = clamp(m.arrow.actualDays + moved, 1, 55 - m.arrow.actualStart); break;
    case 'ms-marker': m.ms.actualDay = clamp(m.ms.actualDay + moved, 0, 55); break;
    case 'unset-body': u.planStart = clamp(u.planStart + moved, 0, 55); break;
    case 'unset-plan-start': { const end = u.planStart + u.planDays; u.planStart = clamp(u.planStart + moved, 0, end - 1); u.planDays = end - u.planStart; break; }
    case 'unset-plan-end': u.planDays = clamp(u.planDays + moved, 1, 55 - u.planStart); break;
    case 'unset-dummy-start': case 'unset-dummy-end': u.planStart = clamp(u.planStart + moved, 0, 55); break;
    case 'arrow-body': m.arrow.planStart = clamp(m.arrow.planStart + moved, 0, 55); m.arrow.actualStart = clamp(m.arrow.actualStart + moved, 0, 55); break;
    case 'arrow-plan-start': { const e1 = m.arrow.planStart + m.arrow.planDays; m.arrow.planStart = clamp(m.arrow.planStart + moved, 0, e1 - 1); m.arrow.planDays = e1 - m.arrow.planStart; break; }
    case 'arrow-plan-end': m.arrow.planDays = clamp(m.arrow.planDays + moved, 1, 55 - m.arrow.planStart); break;
    case 'arrow-actual-start': { const e2 = m.arrow.actualStart + m.arrow.actualDays; m.arrow.actualStart = clamp(m.arrow.actualStart + moved, 0, e2 - 1); m.arrow.actualDays = e2 - m.arrow.actualStart; break; }
    case 'arrow-actual-end': m.arrow.actualDays = clamp(m.arrow.actualDays + moved, 1, 55 - m.arrow.actualStart); break;
    case 'ms': m.ms.day = clamp(m.ms.day + moved, 0, 55); break;
    case 'ms-actual': m.ms.actualDay = clamp(m.ms.actualDay + moved, 0, 55); break;
    case 'ms-dummy': m.ms.day = clamp(m.ms.day + moved, 0, 55); break;
  }
  M = m;
  draw();
  $('hit').textContent = '引いている: ' + drag.id + '（' + (moved >= 0 ? '+' : '') + moved + ' 日）';
});
// FR-013: pressing the marker walks the state round; dragging it moves the actual finish
function cycleState(id) {
  const m = JSON.parse(JSON.stringify(M));
  if (id === 'ms-marker') {
    const on = $('msActual');
    on.checked = !on.checked;
    draw();
    return;
  }
  const item = id === 'task-marker' ? m.task : id === 'unset-marker' ? m.unset : id === 'arrow-marker' ? m.arrow : null;
  if (!item) return;
  const days = item.actualDays || 0;
  if (days === 0) { item.actualStart = item.planStart; item.actualDays = 1; item.percent = 50; }
  else if (item.percent < 100) { item.actualDays = item.planDays; item.percent = 100; }
  else { item.actualDays = 0; item.percent = 0; }
  M = m;
  draw();
  $('hit').textContent = '押して状態を巡らせた: ' + (item.actualDays === 0 ? '未着手' : item.percent + '%');
}
function endDrag(e) {
  if (!drag) return;
  const clicked = drag.moved === 0 && drag.id.endsWith('-marker');
  const id = drag.id;
  drag = null;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  if (clicked) cycleState(id); else draw();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

function summary() {
  const t = M.task, dw = dummyPx();
  $('summary').textContent =
    '今の値（このまま貼って「この値にしろ」と伝えられます）\n' +
    '  掴み代 横: 予定の端 外側 ' + S.s90 + 'px ・ 実績の端 内側 ' + S.s91 + 'px（ダミーも同じ、押せる幅 ' +
    (S.s91 + dw / 2).toFixed(1) + 'px）・ マーカー ' + S.markerGrab + 'px ・ フェード ' + S.s92 +
    'px ・ マイルストーン 外側 ' + S.msGrab + 'px（矢印の実績だけは予定と同じ外側）\n' +
    '  掴み代 縦: 予定 帯の外へ ' + S.planV + 'px ・ 実績とダミー 帯の外へ ' + S.actualV + 'px ・ 下限 ' + S.vMin + 'px\n' +
    '  札: 実績との間隔 ' + S.labelGap + 'px ・ 字の大きさ 実績の高さ × ' + (S.labelFont / 100).toFixed(2) + '\n' +
    '  ポインタの矢印: 一辺 ' + S.cur + 'px（いまの仕様は 24px）\n' +
    '  絵: ズーム ' + S.scale + '% ・ 1 日 ' + S.dayPx + 'px ・ バーの高さ ' + S.barH + 'px\n' +
    '  形: 予定 ' + t.planStart + ' 日目から ' + t.planDays + ' 日 / 実績 ' + t.actualStart + ' 日目から ' + t.actualDays +
    ' 日 / フェード 入 ' + t.fadeIn + '・出 ' + t.fadeOut + ' 日 / 未着手 ' + M.unset.planStart + ' 日目から ' + M.unset.planDays +
    ' 日 / マイルストーン ' + M.ms.day + ' 日目';
}

for (const id of SLIDERS) {
  const input = $(id), out = $(id + 'Out');
  out.textContent = input.value;
  input.addEventListener('input', () => { S[id] = Number(input.value); out.textContent = input.value; draw(); });
}
for (const id of ['showZones', 'showMarker', 'showName', 'showPercent', 'showAssignee', 'msActual']) {
  $(id).addEventListener('change', draw);
}
$('reset').addEventListener('click', () => { M = JSON.parse(JSON.stringify(START)); draw(); });

$('cursorSizes').innerHTML = [12, 14, 16, 20, 24].map(px => {
  const img = '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="0 0 24 24">' +
    '<g transform="scale(-1,1) translate(-24,0)"><path d="M10 4 L2 12 L10 20 L10 15 L20 15 L20 9 L10 9 Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/></g></svg>';
  return '<div class="cursorCell"><img alt="" src="data:image/svg+xml,' + encodeURIComponent(img) + '"><br>' + px + 'px</div>';
}).join('');

draw();
</script>
